<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Coffee Shop Diorama</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{
  /* Layout: full-bleed isometric game stage; shop sign top-left, resource counters top-right,
     toast banners top-centre, a chunky control dock along the bottom. One committed game look in both themes. */
  --ink:#3a2618;
  --paper:#fff4dc;
  --paper-2:#ffe6b8;
  --wood:#9a5f38;
  --wood-hi:#c07e4f;
  --coral:#ff6f59;
  --mint:#32b08c;
  --gold:#ffc23a;
  --sky:#8ed1f0;
  --muted:#8a6a4f;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Nunito","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--font-body);overflow:hidden;-webkit-user-select:none;user-select:none}
.stage{position:relative;height:100%;overflow:hidden;background:var(--sky)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 55%,rgba(40,24,12,.28) 100%)}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:10px;pointer-events:none;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sign,.pill,.dock,.toast,.hint{pointer-events:auto}

/* wooden shop sign */
.sign{position:relative;display:flex;align-items:center;gap:12px;padding:10px 16px 12px;border:3px solid var(--ink);border-radius:16px;
  background:linear-gradient(var(--wood-hi),var(--wood) 60%);box-shadow:0 5px 0 var(--ink),inset 0 3px 0 rgba(255,255,255,.25)}
.sign::before,.sign::after{content:"";position:absolute;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.55}
.sign::before{left:8px}.sign::after{right:8px}
.sign h1{margin:0;font:400 1.55rem/1 var(--font-display);color:var(--paper);letter-spacing:.01em;text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.lamp{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 7px;border-radius:999px;border:3px solid var(--ink);background:var(--paper);
  font:900 .72rem/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.lamp i{width:12px;height:12px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);box-shadow:0 0 10px var(--mint)}
.lamp.closed i{background:var(--coral);box-shadow:0 0 10px var(--coral)}
.lamp small{font:inherit;color:var(--muted)}

/* resource counters */
.res{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.pill{display:flex;align-items:center;gap:7px;height:40px;padding:0 12px 0 6px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.pill b{font:400 1.15rem/1 var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.pill .lbl{font:800 .66rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ico{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper-2)}
.ico svg{width:16px;height:16px}
.ico.coin{background:var(--gold);font:400 .95rem/1 var(--font-display);color:var(--ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.ico.cup{background:#ffd9c9}.ico.ppl{background:#cdeeff}.ico.seat{background:#d5f2df}.ico.bread{background:#ffe1b0}
.ico.time{background:#fff0a8}.ico.time.night{background:#c9cdf7}
.pill.day b+b{margin-left:2px}
.pill .sep{width:2px;height:18px;background:var(--ink);opacity:.2;border-radius:2px}

/* toasts */
.toasts{position:absolute;left:50%;top:84px;transform:translateX(-50%);display:grid;justify-items:center;gap:8px;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border:3px solid var(--ink);border-radius:18px;background:var(--paper);
  box-shadow:0 5px 0 var(--ink);font:400 1.3rem/1 var(--font-display);white-space:nowrap;animation:toastIn .45s cubic-bezier(.2,1.6,.4,1) both}
.toast .ico{width:34px;height:34px}
.toast .ico svg{width:20px;height:20px}
.toast.out{animation:toastOut .35s ease-in both}
.toast.mint .ico{background:#bff0dd}.toast.coral .ico{background:#ffd0c6}.toast.gold .ico{background:#ffe7a3}.toast.blue .ico{background:#cdeeff}
@keyframes toastIn{from{transform:translateY(-14px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(-10px) scale(.9);opacity:0}}

/* bottom dock */
.bottom{display:grid;justify-items:center;gap:8px}
.hint{font:800 .72rem/1 var(--font-body);color:var(--paper);text-shadow:0 2px 0 rgba(58,38,24,.7);letter-spacing:.02em}
.dock{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;border:3px solid var(--ink);border-radius:20px;
  background:var(--paper);box-shadow:0 5px 0 var(--ink);max-width:100%}
.btn{display:grid;place-items:center;height:42px;min-width:42px;padding:0 10px;border:3px solid var(--ink);border-radius:13px;background:var(--paper-2);
  color:var(--ink);font:400 .95rem/1 var(--font-display);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn svg{width:20px;height:20px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--mint);color:#fff}
.btn.play{background:var(--coral);color:#fff}
.btn.play[aria-pressed="true"]{background:var(--paper-2);color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.seg{display:flex;align-items:center;gap:3px;height:42px;padding:3px;border:3px solid var(--ink);border-radius:13px;background:var(--paper-2)}
.seg .tag{display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;font:900 .64rem/1 var(--font-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.seg .tag svg{width:15px;height:15px}
.seg button{height:100%;min-width:30px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--ink);font:400 .9rem/1 var(--font-display);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button:hover{background:rgba(58,38,24,.08)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--paper);box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}
#shop button[data-mode="hours"][aria-checked="true"]{background:var(--gold);color:var(--ink)}
#shop button[data-mode="open"][aria-checked="true"]{background:var(--mint);color:#fff}
#shop button[data-mode="closed"][aria-checked="true"]{background:var(--coral);color:#fff}
.timeline{display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;border:3px solid var(--ink);border-radius:13px;background:var(--paper-2);flex:1 1 150px;min-width:120px;max-width:220px}
.timeline svg{flex:none;width:18px;height:18px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:12px;border-radius:999px;border:2.5px solid var(--ink);
  background:linear-gradient(90deg,#3c4a86 0%,#ffb27a 27%,#8ed1f0 40%,#8ed1f0 72%,#ff9b6a 82%,#3c4a86 92%);cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
@media (max-width:640px){
  .sign h1{font-size:1.2rem}.pill{height:34px;padding:0 9px 0 4px}.pill b{font-size:.98rem}.ico{width:24px;height:24px}
  .pill .lbl{display:none}.hint{display:none}.btn{height:38px;min-width:38px}.seg{height:38px}.timeline{height:38px;max-width:none}
  .toasts{top:auto;bottom:150px}.toast{font-size:1.05rem}
}
@media (prefers-reduced-motion: reduce){.toast,.toast.out{animation-duration:.01s}}
</style>

<div class="stage" id="stage">
  <canvas id="c" aria-label="Isometric 3D café with a bakery and roastery: baristas make drinks and plate cakes from the showcase, customers pick bread from the self-serve tables, order at three tills, sit and leave; a baker bakes and restocks, a roaster roasts beans, and the stock room holds the fridges and ice machine"></canvas>
  <div class="vignette"></div>
  <div class="ui">
    <header class="top">
      <div class="sign">
        <h1>Coffee Shop</h1>
        <div class="lamp" id="status"><i></i><span>Open</span></div>
      </div>
      <div class="res" aria-live="polite">
        <div class="pill day"><span class="ico time" id="dayico"><svg><use href="#i-sun"/></svg></span><span class="lbl">Day</span><b id="day">1</b><span class="sep"></span><b id="clock">07:36</b></div>
        <div class="pill" title="Takings today"><span class="ico coin">₩</span><b id="revenue">0</b></div>
        <div class="pill" title="Cups served today"><span class="ico cup"><svg><use href="#i-cup"/></svg></span><b id="served">0</b><span class="lbl">served</span></div>
        <div class="pill" title="Customers in line"><span class="ico ppl"><svg><use href="#i-ppl"/></svg></span><b id="inline">0</b><span class="lbl">in line</span></div>
        <div class="pill" title="Bakery items sold today"><span class="ico bread"><svg><use href="#i-bread"/></svg></span><b id="baked">0</b><span class="lbl">bakery</span></div>
        <div class="pill" id="seatpill" title="Seats taken"><span class="ico seat"><svg><use href="#i-seat"/></svg></span><b id="seated">0</b><span class="lbl" id="seatcap">seated</span></div>
      </div>
    </header>
    <div class="toasts" id="toasts"></div>
    <div class="bottom">
      <span class="hint">Drag to rotate · scroll or pinch to zoom · right-drag to pan</span>
      <footer class="dock">
        <button id="play" type="button" class="btn play" aria-label="Pause clock" aria-pressed="false"><svg><use href="#i-pause"/></svg></button>
        <div class="seg" id="speed" role="radiogroup" aria-label="Playback speed">
          <span class="tag"><svg><use href="#i-fast"/></svg></span>
          <button type="button" role="radio" data-speed="0.5" aria-checked="false">½×</button>
          <button type="button" role="radio" data-speed="1" aria-checked="true">1×</button>

          <button type="button" role="radio" data-speed="4" aria-checked="false">4×</button>
          <button type="button" role="radio" data-speed="8" aria-checked="false">8×</button>
        </div>
        <label class="timeline" for="time">
          <svg aria-hidden="true"><use href="#i-moon"/></svg>
          <input id="time" type="range" min="0" max="24" step="0.05" value="7.6" aria-label="Time of day">
          <svg aria-hidden="true"><use href="#i-moon"/></svg>
        </label>
        <div class="seg" id="shop" role="radiogroup" aria-label="Shop status">
          <span class="tag"><svg><use href="#i-store"/></svg>Shop</span>
          <button type="button" role="radio" data-mode="hours" aria-checked="true" title="Follow opening hours, 07:00–21:00">Auto</button>

          <button type="button" role="radio" data-mode="closed" aria-checked="false">Closed</button>

      </footer>
    </div>

</div>

<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('c');
  const INK = '#3a2618';

  /* ---------- renderer, camera, controls ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.NoToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  const effect = THREE.OutlineEffect
    ? new THREE.OutlineEffect(renderer, { defaultThickness: 0.0034, defaultColor: [0.2, 0.12, 0.07], defaultAlpha: 1 })
    : null;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8ed1f0);
  // isometric-style orthographic camera, like a management sim
  const camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
  const HOME = new THREE.Vector3(20.2, 22.5, 28.5);
  const HOME_TARGET = new THREE.Vector3(-2.4, 0.6, 2.4);
  camera.position.copy(HOME);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.copy(HOME_TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minZoom = 0.7;
  controls.maxZoom = 4.5;
  controls.minPolarAngle = Math.PI * 0.12;
  controls.maxPolarAngle = Math.PI * 0.44;
  controls.screenSpacePanning = true;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 0.45;

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    const a = w / Math.max(h, 1);
    const half = a >= 1.3 ? 14.3 : 15.2 * 1.3 / a * 0.92;
    camera.left = -half * a; camera.right = half * a; camera.top = half; camera.bottom = -half;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- helpers ---------- */
  let seed = 20261027;
  const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const R = (a, b) => a + (b - a) * Math.random();
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const v3 = (x, z, y = 0) => new THREE.Vector3(x, y, z);

  function canvasTex(w, h, draw) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    t.userData.canvas = c;
    return t;
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  }

  // three-band toon ramp: shadow, mid, lit
  const gradientMap = (() => {
    const fmt = renderer.capabilities.isWebGL2 ? THREE.RedFormat : THREE.LuminanceFormat;
    const t = new THREE.DataTexture(new Uint8Array([88, 170, 255]), 3, 1, fmt);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;

    const cupHold = makeCup(true); cupHold.position.set(0.17, 0.74, 0.3); cupHold.visible = false; inner.add(cupHold);
    const leftHold = new THREE.Group(); leftHold.position.set(-0.17, 0.72, 0.3); inner.add(leftHold);      // plate, bag
    const frontHold = new THREE.Group(); frontHold.position.set(0, 0.74, 0.34); inner.add(frontHold);    // two-handed: tray, sack, bucket
    outer.scale.setScalar(PERSON_SCALE);
    scene.add(outer);
    return { outer, inner, hipL, hipR, armL, armR, cupHold, leftHold, frontHold, phase: Math.random() * 6, face: 0, hop: 0 };
  }
  // what someone has in their hands: a cup (right), something in the left hand, or one thing held in front with both
  function hold(e, slot, obj) {
    if (slot === 'cup') { e.hands.cup = !!obj; return; }
    const g = slot === 'left' ? e.p.leftHold : e.p.frontHold;
    while (g.children.length) g.remove(g.children[0]);
    if (obj) g.add(obj);

  }

  function lerpAngle(a, b, t) {
    let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    return a + d * t;
  }

  let elapsed = 0;
  function animatePerson(p, s, dt) {
    p.phase += dt * (s.moving ? 9 : 0);
    const sw = s.moving ? Math.sin(p.phase) * 0.6 : 0;
    const k = 1 - Math.exp(-dt * 12);
    p.hipL.rotation.x += ((s.seated ? -Math.PI / 2 : sw) - p.hipL.rotation.x) * k;
    p.hipR.rotation.x += ((s.seated ? -Math.PI / 2 : -sw) - p.hipR.rotation.x) * k;
    let aL = s.moving ? -sw * 0.8 : (s.seated ? -0.6 : 0.05 * Math.sin(elapsed * 1.6 + p.phase));
    let aR = s.moving ? sw * 0.8 : (s.seated ? -0.8 : 0.05 * Math.sin(elapsed * 1.6 + p.phase + 1));
    let zL = 0, zR = 0;
    if (s.cup) aR = -1.2;
    if (s.left) aL = -1.2;
    if (s.front) { aL = aR = -1.05; zL = 0.32; zR = -0.32; }
    if (s.pose === 'brew') { aR = -1.1 + 0.22 * Math.sin(elapsed * 8); aL = -0.95 + 0.15 * Math.sin(elapsed * 6 + 1); }
    else if (s.pose === 'reach') { aR = -1.35 + 0.12 * Math.sin(elapsed * 5); aL = s.cup || s.left ? aL : -1.3 + 0.1 * Math.sin(elapsed * 5 + 2); }
    else if (s.pose === 'up') { aL = aR = -2.75 + 0.12 * Math.sin(elapsed * 7); zL = 0.2; zR = -0.2; }
    else if (s.pose === 'knead') { aR = -0.95 + 0.3 * Math.sin(elapsed * 7); aL = -0.95 + 0.3 * Math.sin(elapsed * 7 + Math.PI); zL = 0.25; zR = -0.25; }
    if (p.hop > 0) { aL = s.left || s.front ? aL : -2.6; aR = s.cup || s.front ? aR : -2.6; }                 // cheer
    p.armL.rotation.x += (aL - p.armL.rotation.x) * k;
    p.armR.rotation.x += (aR - p.armR.rotation.x) * k;
    p.armL.rotation.z = p.hop > 0 && !s.left && !s.front ? -0.4 : zL; p.armR.rotation.z = p.hop > 0 && !s.cup && !s.front ? 0.4 : zR;
    let yT = s.seated ? -0.065 : (s.moving ? Math.abs(Math.cos(p.phase)) * 0.07 : 0.012 * Math.sin(elapsed * 2.2 + p.phase));
    let squash = 1;
    if (p.hop > 0) {
      p.hop = Math.max(0, p.hop - dt * 1.8);
      const u = 1 - p.hop;
      yT += Math.max(0, Math.sin(u * Math.PI * 2)) * 0.28;
      squash = 1 + Math.sin(u * Math.PI * 4) * 0.06 * p.hop;
    }
    p.inner.position.y += (yT - p.inner.position.y) * (p.hop > 0 ? 1 : k);
    p.inner.scale.set(1 / Math.sqrt(squash), squash, 1 / Math.sqrt(squash));
    p.inner.rotation.z = s.moving ? Math.sin(p.phase) * 0.06 : 0;
    p.cupHold.visible = !!s.cup;
    p.leftHold.visible = !!s.left; p.frontHold.visible = !!s.front;
    p.outer.rotation.y = lerpAngle(p.outer.rotation.y, p.face, 1 - Math.exp(-dt * 10));
  }

  /* ---------- walking with local avoidance ----------
     Everyone on their feet is in `crowd`. A walker looks about 1.3 m ahead along its heading:
     - someone going the same way ahead → slow down and follow instead of walking through them
     - someone standing or coming the other way → sidestep, always to the same relative side,
       so two people meeting head-on veer apart like pedestrians keeping right
     If a walker stays blocked for 1.5 s it briefly ignores others, so nobody can deadlock. */
  const crowd = [];
  const SEE = 1.3, CLEAR = 0.62;
  function walk(e, dt, speed) {
    if (!e.path.length) { e.stepping = false; return false; }
    if (!e.vel) { e.vel = new THREE.Vector3(); e.blockT = 0; e.ghost = 0; }
    const t = e.path[0];
    let dx = t.x - e.pos.x, dz = t.z - e.pos.z;
    const dist = Math.hypot(dx, dz);
    if (dist < 1e-4) { e.path.shift(); return true; }
    // someone is already standing on my final spot: stop just short of them instead of walking into them
    if (e.path.length === 1 && dist < 0.7 && crowd.some(o => o !== e && !o.walking && Math.hypot(o.pos.x - t.x, o.pos.z - t.z) < 0.45)) {
      e.path.shift(); e.stepping = false; return true;
    }
    dx /= dist; dz /= dist;
    let sx = 0, sz = 0, slow = 1;
    if (e.ghost > 0) e.ghost -= dt;
    else for (const o of crowd) {
      if (o === e) continue;
      const ox = o.pos.x - e.pos.x, oz = o.pos.z - e.pos.z;
      const d = Math.hypot(ox, oz);
      if (d > SEE || d < 1e-4) continue;
      const ahead = ox * dx + oz * dz;                  // how far in front of me
      if (ahead < -0.1) continue;                        // behind me
      if (!o.walking && ahead > dist + 0.35) continue;   // standing past where I stop
      const side = ox * -dz + oz * dx;                   // > 0: they are on my left
      if (Math.abs(side) > CLEAR + 0.2) continue;        // far enough to the side already
      const ov = o.vel && o.walking ? (o.vel.x * dx + o.vel.z * dz) : 0;
      if (ov > 0.35) {                                   // same direction: queue up behind them
        slow = Math.min(slow, clamp((d - 0.55) / 0.45, 0, 1));
        continue;
      }
      const away = side > 0.04 ? -1 : 1;                 // dead ahead → always the same side
      const near = 1 - d / SEE;
      const settle = clamp(dist / 0.6, 0.2, 1);          // stop swerving as I reach my spot
      sx += -dz * away * near * 1.8 * settle;
      sz += dx * away * near * 1.8 * settle;
      if (d < 0.55 && ahead > 0) slow = Math.min(slow, 0.35);
    }
    e.blockT = slow < 0.5 ? e.blockT + dt : 0;
    if (e.blockT > 1.5) { e.ghost = 1.0; e.blockT = 0; }
    let vx = dx + sx, vz = dz + sz;
    const vl = Math.hypot(vx, vz) || 1; vx /= vl; vz /= vl;
    const step = speed * slow * dt;
    if (dist <= step + 0.02) { e.pos.x = t.x; e.pos.z = t.z; e.path.shift(); }
    else { e.pos.x += vx * step; e.pos.z += vz * step; }
    if (e.clampZ) e.pos.z = clamp(e.pos.z, e.clampZ[0], e.clampZ[1]);
    if (slow > 0.05) e.p.face = Math.atan2(vx, vz);
    e.vel.set(vx * speed * slow, 0, vz * speed * slow);
    e.stepping = slow > 0.2;                             // legs stop while waiting for someone to pass
    return true;
  }

  /* ---------- steam ---------- */
  const puffs = [];
  for (let i = 0; i < 170; i++) {
    const m = new THREE.SpriteMaterial({ map: steamTex, transparent: true, depthWrite: false, opacity: 0, color: 0xffffff });
    const s = new THREE.Sprite(m); s.visible = false; scene.add(s);
    puffs.push({ s, life: 0, max: 1, alive: false, drift: 0, strength: 1, big: 1 });
  }
  // kind 'smoke' is the roaster's chimney: greyer, bigger, longer-lived
  function emit(x, y, z, strength, kind) {
    const p = puffs.find(q => !q.alive); if (!p) return;
    const smoke = kind === 'smoke';
    p.alive = true; p.life = 0; p.max = smoke ? R(2.2, 3.2) : R(1.2, 1.9); p.drift = R(0, 6); p.strength = strength; p.big = smoke ? 2.6 : 1;
    p.s.material.color.setHex(smoke ? 0xb9b2aa : 0xffffff);
    p.s.position.set(x + R(-0.02, 0.02), y, z + R(-0.02, 0.02)); p.s.visible = true;
  }
  function updatePuffs(dt) {
    for (const p of puffs) {
      if (!p.alive) continue;
      p.life += dt;
      const u = p.life / p.max;
      if (u >= 1) { p.alive = false; p.s.visible = false; continue; }
      p.s.position.y += dt * (0.34 + 0.2 * (1 - u));
      p.s.position.x += Math.sin(elapsed * 1.7 + p.drift) * dt * 0.06;
      p.s.position.z += Math.cos(elapsed * 1.3 + p.drift) * dt * 0.04;
      const sc = (0.1 + u * 0.3) * p.big; p.s.scale.set(sc, sc, sc);
      p.s.material.opacity = 0.75 * Math.sin(Math.PI * u) * p.strength;
    }
  }
  const emitters = [];
  function makeEmitter(x, y, z, kind) { const e = { x, y, z, rate: 0, acc: 0, kind }; emitters.push(e); return e; }
  stations.forEach(st => {
    st.steam = st.heads.map(x => makeEmitter(x, TOP_BACK + 0.12, st.z + 0.4));
    st.heads.forEach(x => { const c = makeCup(false); c.position.set(x, TOP_BACK + 0.05, st.z + 0.36); scene.add(c); });
  });

  /* ---------- floating popups: coins, hearts ---------- */
  const popups = [];
  function popup(tex, pos, sx, sy, rise = 0.9, life = 1.3) {
    const s = new THREE.Sprite(spriteMat(tex)); s.renderOrder = 20;
    s.position.copy(pos); s.scale.set(0.01, 0.01, 1); scene.add(s);
    popups.push({ s, y0: pos.y, t: 0, life, rise, sx, sy });
  }
  function updatePopups(dt) {
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i]; p.t += dt;
      const u = p.t / p.life;
      if (u >= 1) { scene.remove(p.s); p.s.material.dispose(); popups.splice(i, 1); continue; }
      const pop = u < 0.18 ? 1 + 0.35 * Math.sin(u / 0.18 * Math.PI) : 1;

  /* ---------- simulation ---------- */
  // customers queue in a line by the east aisle, step up to whichever till is free, and wait there for their order
  const ORDER_Z = FRONT_Z + 0.93;
  const QUEUE_X = 1.8;
  const QUEUE = Array.from({ length: 8 }, (_, i) => v3(QUEUE_X, -2.9 + i * 0.8));
  const QUEUE_IN = v3(QUEUE_X, FRONT_AISLE + 0.3);
  const TAKEAWAY_AISLE = 3.15;
  const IN_STREET = v3(STREET.x - 0.32, STREET.z), IN_DOOR = v3(ENTRY.x - 0.32, ENTRY.z);
  const OUT_DOOR = v3(ENTRY.x + 0.32, ENTRY.z), OUT_STREET = v3(STREET.x + 0.32, STREET.z);
  const IN_AISLE = FRONT_AISLE + 0.3, OUT_AISLE = FRONT_AISLE - 0.3;   // arrivals and departures use opposite halves of the front aisle

  /* ---------- staff routes ----------
     Every place a member of staff works is a spot: where to stand, which way to face, and the chain of
     corridor points that leads to it. Back-of-house spots hang off one corridor running just inside the
     glass partition (AISLE_X); the bar spots hang off the point where the bar lane meets that corridor.
     A trip walks back up the chain it is on and down the other one, sharing whatever start they have in common. */
  const AISLE_X = -10.65;
  const A = z => v3(AISLE_X, z);
  const L_W = A(LANE_Z), STORE_DOOR = v3(STORE_X, LANE_Z);
  const A_RO = A(1.7), RO_HUB = v3(-13.2, 1.7);
  const spot = (x, z, face, entry) => ({ pos: v3(x, z), face, entry });
  const barSpot = (x, z, face) => spot(x, z, face, [L_W]);
  const CAFE_ROUTE = [A(LANE), v3(-9.4, LANE), v3(6.0, LANE), v3(6.0, REFILL_Z)];
  const SPOT = {
    ice: spot(ICE_MX, LANE_Z - 0.05, Math.PI, [L_W, STORE_DOOR]),
    fridge: spot(X0 + 1.4, -5.42, -Math.PI / 2, [L_W, STORE_DOOR]),
    oven: spot(OVEN_X + 1.1, OVEN_Z, -Math.PI / 2, [A(OVEN_Z)]),
    rack: spot(RACK_X + 0.55, RACK_Z - 0.15, -Math.PI / 2, [A(RACK_Z - 0.15)]),
    knead: spot(WT_X + 0.15, WT_Z + 0.9, Math.PI, [A(WT_Z + 0.9)]),
    pallet: spot(PAL_X + 1.0, PAL_Z, -Math.PI / 2, [A_RO, RO_HUB, v3(PAL_X + 1.0, 0.55)]),
    hopper: spot(RO_X + 0.9, RO_Z - 0.75, -0.95, [A_RO, RO_HUB]),
    panel: spot(RO_X + 1.25, RO_Z + 0.05, -Math.PI / 2, [A_RO, RO_HUB]),
    tray: spot(CT_X + 0.9, CT_Z, -Math.PI / 2, [A_RO, RO_HUB]),

    showcase: barSpot(SC_CX, LANE_Z + 0.22, 0),
    urn: barSpot(URN_SPOT_X, LANE_Z - 0.26, Math.PI),
    iceBin: barSpot(ICE_X, LANE_Z - 0.26, Math.PI),
  };
  breadTables.forEach(t => { t.refill = spot(t.x, REFILL_Z, 0, CAFE_ROUTE); });
  function route(from, to) {
    const a = from ? from.entry : [], b = to.entry;
    let k = 0;
    while (k < a.length && k < b.length && a[k] === b[k]) k++;
    return [...a.slice(k).reverse(), ...b.slice(k), to.pos].map(p => p.clone());
  }

  const tills = ORDER_X.map(x => ({ pos: v3(x, ORDER_Z), spot: barSpot(x, LANE_Z + 0.26, 0), cust: null }));   // hand over at the front counter's edge
  const state = { hour: 7.6, playing: !reduceMotion, served: 0, baked: 0, revenue: 0, day: 1, spawnIn: 1.5, mode: 'hours', speed: 1, ice: 0.75 };
  const queue = [], customers = [], orders = [];

  /* ---------- staff: a worker runs a list of jobs; each job is "walk to a spot, then do something there for a while" ---------- */
  function makeWorker(look, at, extra) {
    const w = Object.assign({
      p: makePerson(look), at, pos: at.pos.clone(), path: [], jobs: [], job: null, phase: '', timer: 0,
      hands: { cup: false, left: null, front: null }, pose: null, scale: 0, idleT: R(1, 3),
    }, extra);
    w.p.face = at.face; w.p.outer.rotation.y = at.face;
    return w;
  }
  function runJobs(w, dt, speed) {
    if (!w.job && w.jobs.length) { w.job = w.jobs.shift(); w.phase = 'go'; w.path = route(w.at, w.job.spot); }
    const j = w.job;
    w.pose = null;
    if (!j) return false;
    if (w.phase === 'go') {
      const moving = walk(w, dt, speed);
      if (!moving) { w.phase = 'act'; w.timer = j.dur; w.at = j.spot; if (j.start) j.start(w); }
      return moving;
    }
    w.p.face = j.spot.face;
    w.pose = j.pose || null;
    w.timer -= dt;
    if (j.tick) j.tick(w, clamp(1 - w.timer / j.dur, 0, 1));
    if (w.timer <= 0) { w.job = null; if (j.done) j.done(w); }
    return false;
  }
  const busy = w => !!w.job || w.jobs.length > 0;

  const STAFF = [
    { skin: 0xf2bf98, hair: 0x3a2618, shirt: 0xf3ece0, pants: 0x3a3f52, apron: 0x2f8a6f },
    { skin: 0xa8714f, hair: 0x1f1d1c, shirt: 0xf3ece0, pants: 0x46607e, apron: 0x2f8a6f },
    { skin: 0xffd9bf, hair: 0xd9604a, shirt: 0xf3ece0, pants: 0x5a4636, apron: 0x2f8a6f },
  ];
  const baristas = stations.map((st, i) => {
    st.brewSpot = barSpot(st.x, LANE_Z - 0.26, Math.PI);            // brew with your back to the lane's middle
    st.grinderSpot = barSpot(st.x - 0.98, LANE_Z - 0.26, Math.PI);
    return makeWorker(STAFF[i], st.brewSpot, {
      st, current: null, prog: makeProgress(), scale: 1, iceRun: false,
      clampZ: [LANE_Z - 0.28, LANE_Z + 0.28],   // stay between the counters while dodging
    });
  });
  // the baker comes in at five to have bread out for opening; the roaster works daytime hours
  const baker = makeWorker({ skin: 0xffd9bf, hair: 0x6b3f22, shirt: 0xffffff, pants: 0x3a3f52, apron: 0xd9a066, hat: 'toque' }, SPOT.knead, { home: SPOT.knead, shift: [5, 20.5] });
  const roaster = makeWorker({ skin: 0xd9996e, hair: 0x1f1d1c, shirt: 0x46607e, pants: 0x5a4636, apron: 0x6b4127, hat: 'beanie' }, SPOT.panel, { home: SPOT.panel, shift: [7, 19] });
  const staff = [...baristas, baker, roaster];
  const onShift = (w, h) => h >= w.shift[0] && h < w.shift[1];

  /* ---------- customers ---------- */
  const browsingNow = () => customers.filter(c => c.browse && !c.picked && c.state !== 'leaving' && c.state !== 'exit').length;
  function planOrder(noBrowse) {
    const canBrowse = !noBrowse && breadStock() > 0 && browsingNow() < 3;
    const breadOnly = canBrowse && Math.random() < 0.15;
    const wantsBread = breadOnly || (canBrowse && Math.random() < 0.42);
    const drink = breadOnly ? null : pickWeighted(MENU);
    let dessert = null;
    if (drink && Math.random() < 0.3) {
      const opts = DESSERTS.filter(f => f.avail > 0);
      if (opts.length) { dessert = pickWeighted(opts); dessert.avail--; }   // reserve the slice now
    }
    return { drink, dessert, wantsBread, breads: [] };
  }
  function spawnCustomer(noBrowse) {
    const order = planOrder(noBrowse);
    const c = {
      p: makePerson({ skin: pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT), pants: pick(PANTS) }),
      pos: IN_STREET.clone(), path: [IN_DOOR.clone()], state: 'enter', till: null, leftTill: null, ready: false,
      hands: { cup: false, left: null, front: null }, chair: null, sitT: 0, sitT0: 1, cup: null, plate: null, steam: null,
      scale: 0, speed: R(1.3, 1.6), seatLerp: 0, order, browse: null, picked: false, payT: 0, timer: 0, foods: [],
      bubble: new THREE.Sprite(spriteMat(orderBubble(order.drink, order.dessert || (order.wantsBread ? BREADS[0] : null)))), bubbleK: 0, bob: Math.random() * 6
    };
    if (order.wantsBread) {
      // head for one of the bread tables first, then join the queue with a tray
      const tables = breadTables.filter(t => t.baskets.some(b => b.count > 0));
      const t = pick(tables.length ? tables : breadTables), side = Math.floor(Math.random() * 2);
      c.browse = { table: t, side, at: t.browse[side] };
      c.path.push(v3(c.browse.at.x, IN_AISLE), c.browse.at.clone());
    } else {
      c.path.push(QUEUE_IN.clone());
      queue.push(c);
    }
    c.bubble.renderOrder = 18; c.bubble.scale.set(0.01, 0.01, 1); scene.add(c.bubble);
    c.p.outer.scale.setScalar(0.001);
    customers.push(c);
    return c;
  }

  function removeCustomer(c) {
    scene.remove(c.p.outer);

    if (c.cup) scene.remove(c.cup);
    if (c.plate) scene.remove(c.plate);
    if (c.steam) emitters.splice(emitters.indexOf(c.steam), 1);
    customers.splice(customers.indexOf(c), 1);
    const qi = queue.indexOf(c); if (qi >= 0) queue.splice(qi, 1);
    const oi = orders.indexOf(c); if (oi >= 0) orders.splice(oi, 1);
    if (c.till && c.till.cust === c) c.till.cust = null;
    if (c.leftTill && c.leftTill.cust === c) c.leftTill.cust = null;
    if (c.chair && c.chair.taken === c) c.chair.taken = false;
  }

  function busyness(h) {
    return 0.22 + 0.9 * Math.exp(-(((h - 8.4) / 1.1) ** 2)) + 0.65 * Math.exp(-(((h - 12.6) / 0.9) ** 2)) + 0.35 * Math.exp(-(((h - 15.5) / 1.4) ** 2));
  }
  const inHours = h => h >= 7 && h < 21;
  const isOpen = h => state.mode === 'hours' ? inHours(h) : state.mode === 'open';
  const shopBusy = () => customers.length > 0 || orders.length > 0 || baristas.some(busy);
  function lightsOn(h) {
    if (state.mode === 'open') return true;
    if (state.mode === 'closed') return shopBusy();
    return (h >= 6.5 && h < 21.6) || shopBusy();
  }

  // pay: drink + plated cake + whatever bread is on the tray
  function settle(c) {
    const o = c.order;
    const total = (o.drink ? o.drink.price : 0) + (o.dessert ? o.dessert.price : 0) + o.breads.reduce((s, b) => s + b.price, 0);
    c.ready = true; state.revenue += total;
    if (o.drink) state.served++;
    state.baked += (o.dessert ? 1 : 0) + o.breads.length;
    popup(coinTextTex('+₩' + total.toLocaleString('en-US')), tmpV.set(c.till.pos.x, 2.7, FRONT_Z), 2.3, 0.69, 1.0, 1.5);
  }

  // take one or two breads from the two baskets in front of where the customer stands
  function pickBread(c) {
    const t = c.browse.table, mine = t.baskets.slice(c.browse.side * 2, c.browse.side * 2 + 2);
    const want = Math.random() < 0.65 ? 1 : 2;
    for (let n = 0; n < want; n++) {
      const pool = mine.filter(b => b.count > 0).length ? mine.filter(b => b.count > 0) : t.baskets.filter(b => b.count > 0);
      if (!pool.length) break;
      const b = pick(pool); b.count--; syncBasket(b); c.order.breads.push(b.type);
    }
  }

  const tmpV = new THREE.Vector3();
  function updateCustomers(dt) {
    if (isOpen(state.hour)) {
      state.spawnIn -= dt;
      if (state.spawnIn <= 0) {
        if (queue.length + browsingNow() < QUEUE.length && customers.length < 38) spawnCustomer();
        state.spawnIn = R(0.6, 1.4) * 2.8 / busyness(state.hour);   // about 3× the small shop's footfall, now there's a bakery too
      }
    }
    for (const c of customers.slice()) {
      const targetScale = c.state === 'exit' ? 0 : 1;
      c.scale += (targetScale - c.scale) * (1 - Math.exp(-dt * 8));
      if (c.state === 'exit' && c.scale < 0.02) { removeCustomer(c); continue; }

      let moving = false;
      if (c.state === 'enter') {
        moving = walk(c, dt, c.speed);
        if (!moving) {
          if (c.browse && !c.picked) { c.state = 'browse'; c.timer = R(1.8, 2.8); }
          else c.state = 'queue';
        }
      } else if (c.state === 'browse') {
        c.p.face = Math.PI;
        c.timer -= dt;
        if (c.timer <= 0) {
          pickBread(c); c.picked = true;
          const at = c.browse.at;
          if (!c.order.breads.length && !c.order.drink) {
            c.path = [v3(at.x, OUT_AISLE), OUT_DOOR.clone(), OUT_STREET.clone()]; c.state = 'leaving';   // shelves were empty
          } else {
            if (c.order.breads.length) hold(c, 'front', trayOf(c.order.breads));
            c.path = [v3(at.x, IN_AISLE), QUEUE_IN.clone()]; c.state = 'toQueue';
          }
        }
      } else if (c.state === 'toQueue') {
        moving = walk(c, dt, c.speed);
        if (!moving) { queue.push(c); c.state = 'queue'; }
      } else if (c.state === 'queue') {
        const i = queue.indexOf(c);
        const spot = QUEUE[Math.min(i, QUEUE.length - 1)];
        if (!c.path.length && (Math.abs(c.pos.x - spot.x) > 0.01 || Math.abs(c.pos.z - spot.z) > 0.01)) c.path = [spot];
        if (c.path.length && c.path[c.path.length - 1] !== spot) c.path = [spot];
        moving = walk(c, dt, c.speed);
        if (!moving) {
          c.p.face = lerpAngle(c.p.face, Math.PI, 0.08);
          const till = i === 0 && tills.find(t => !t.cust);
          if (till) {
            till.cust = c; c.till = till; queue.shift();
            c.path = [till.pos.clone()]; c.state = 'toTill';
          }
        }
      } else if (c.state === 'toTill') {
        moving = walk(c, dt, c.speed);
        if (!moving) {
          c.p.face = Math.PI; c.state = 'waiting';
          if (c.order.drink || c.order.dessert) orders.push(c);
          else c.payT = 1.4;                                   // bread only: just pay at the till
        }
      } else if (c.state === 'waiting') {
        c.p.face = Math.PI;
        if (!c.ready && !c.order.drink && !c.order.dessert) { c.payT -= dt; if (c.payT <= 0) settle(c); }
        if (c.ready) {
          c.leftTill = c.till; c.till = null;   // the till stays taken until they've stepped away
          c.foods = [...(c.order.dessert ? [c.order.dessert] : []), ...c.order.breads];
          const free = chairs.filter(ch => !ch.taken);
          const sit = free.length && Math.random() < (c.foods.length ? 0.82 : 0.75);
          hold(c, 'front', null);
          hold(c, 'cup', !!c.order.drink);
          hold(c, 'left', c.foods.length ? (sit ? plateWith(c.foods) : paperBag()) : null);
          c.p.hop = 1;
          popup(heartTex, tmpV.set(c.pos.x, 2.75, c.pos.z), 0.7, 0.7, 0.9, 1.1);
          const toLane = v3(c.pos.x, LANE);
          if (sit) {
            c.chair = pick(free); c.chair.taken = c;
            c.path = [toLane, v3(c.chair.aisle, LANE), c.chair.approach.clone()];
            c.state = 'toSeat';
          } else {
            c.path = [toLane, v3(TAKEAWAY_AISLE, LANE), v3(TAKEAWAY_AISLE, OUT_AISLE), OUT_DOOR.clone(), OUT_STREET.clone()];
            c.state = 'leaving';
          }
          c.waitHop = 0.6;
        }
      } else if (c.state === 'toSeat') {
        // cheer in place first; only a frame that actually walked can count as arriving
        if (c.waitHop > 0) c.waitHop -= dt;
        else {
          moving = walk(c, dt, c.speed);
          if (!moving) { c.state = 'sitting'; c.seatLerp = 0; c.sitT = c.sitT0 = R(16, 30); c.from = c.pos.clone(); }
        }
      } else if (c.state === 'sitting') {
        if (c.seatLerp < 1) {
          c.seatLerp = Math.min(1, c.seatLerp + dt / 0.45);
          c.pos.lerpVectors(c.from, c.chair.pos, c.seatLerp);
          c.p.face = c.chair.face;
          if (c.seatLerp >= 1 && !c.cup && !c.plate) {
            const t = c.chair.table;
            const cx = t.x + (c.chair.pos.x - t.x) * 0.42;
            const both = c.order.drink && c.foods.length;
            if (c.order.drink) {
              const cz = t.z + (both ? -0.14 : 0);
              c.cup = makeCup(true); c.cup.position.set(cx, 0.815, cz); scene.add(c.cup);
              c.steam = makeEmitter(cx, 0.97, cz); c.steam.rate = 1.3;
            }
            if (c.foods.length) {
              c.plate = plateWith(c.foods); c.plate.position.set(cx, 0.815, t.z + (both ? 0.15 : 0)); scene.add(c.plate);
              c.plate.children.forEach(o => { o.userData.s = o.scale.x; });
            }
            hold(c, 'cup', false); hold(c, 'left', null);
          }
        } else {
          c.sitT -= dt;
          if (c.steam) c.steam.rate = Math.max(0.2, c.steam.rate - dt * 0.06);
          if (c.plate) {                                         // nibble away at the plate
            const k = Math.max(0.12, c.sitT / c.sitT0 * 1.1);
            c.plate.children.forEach((o, i) => { if (i) o.scale.setScalar(o.userData.s * Math.min(1, k)); });
          }
          if (c.sitT <= 0) {
            if (c.cup) { scene.remove(c.cup); c.cup = null; }
            if (c.plate) { scene.remove(c.plate); c.plate = null; }
            if (c.steam) { emitters.splice(emitters.indexOf(c.steam), 1); c.steam = null; }
            hold(c, 'cup', !!c.order.drink);
            c.chair.taken = false;
            c.path = [c.chair.approach.clone(), v3(c.chair.aisle, OUT_AISLE), OUT_DOOR.clone(), OUT_STREET.clone()];
            c.state = 'leaving';
          }
        }
      } else if (c.state === 'leaving') {
        if (c.waitHop > 0) c.waitHop -= dt;
        else {
          moving = walk(c, dt, c.speed);
          if (!moving) c.state = 'exit';   // fade out only once the path to the street is done
        }
      }
      if (c.leftTill && Math.hypot(c.pos.x - c.leftTill.pos.x, c.pos.z - c.leftTill.pos.z) > 0.75) { c.leftTill.cust = null; c.leftTill = null; }
      const seated = c.state === 'sitting' && c.seatLerp >= 0.6;
      c.p.outer.position.set(c.pos.x, 0, c.pos.z);
      c.p.outer.scale.setScalar(Math.max(0.001, c.scale) * PERSON_SCALE);
      animatePerson(c.p, {
        moving: moving && c.stepping !== false, seated,
        cup: c.hands.cup && !seated, left: c.hands.left && !seated, front: c.hands.front && !seated,
        pose: c.state === 'browse' ? 'reach' : null,
      }, dt);

      // order bubble: shown from the door until the order arrives
      const want = (c.state === 'enter' || c.state === 'browse' || c.state === 'toQueue' || c.state === 'queue' || c.state === 'toTill' || c.state === 'waiting') && !c.ready ? 1 : 0;
      c.bubbleK += (want - c.bubbleK) * (1 - Math.exp(-dt * (want ? 9 : 14)));
      const pop = c.bubbleK * (1 + 0.12 * Math.max(0, Math.sin(Math.min(1, c.bubbleK) * Math.PI)));
      c.bubble.scale.set(0.95 * pop + 0.001, 1.1 * pop + 0.001, 1);
      c.bubble.position.set(c.pos.x, 2.85 + Math.sin(elapsed * 3 + c.bob) * 0.05, c.pos.z);
      c.bubble.visible = c.bubbleK > 0.02;
    }
  }

  /* ---------- baristas: drinks, plated cakes, and fetching ice from the stock room ---------- */
  function showcaseSpot(f) {
    const m = f.slots[Math.max(0, f.shown - 1)];
    return barSpot(m.position.x, LANE_Z + 0.22, 0);
  }
  function takeSlice(f) { if (f.shown > 0) { f.shown--; f.slots[f.shown].visible = false; } }
  DESSERTS.forEach(f => { f.shown = 4; });
  function planDrinks(b, c) {
    const d = c.order.drink, f = c.order.dessert;
    b.current = c;
    if (d) {
      b.jobs.push({
        spot: d.coldBrew ? SPOT.urn : b.st.brewSpot, dur: d.coldBrew ? 1.5 : 2.6, pose: 'brew', brew: !d.coldBrew,
        tick: (w, u) => w.prog.draw(u, d),
        done: w => { hold(w, 'cup', true); if (!d.coldBrew) w.st.beans = Math.max(0, w.st.beans - 0.07); },
      });
      if (d.kind === 'iced') b.jobs.push({ spot: SPOT.iceBin, dur: 0.6, pose: 'reach', done: () => { state.ice = Math.max(0, state.ice - 0.07); } });
    }
    if (f) b.jobs.push({ spot: showcaseSpot(f), dur: 0.8, pose: 'reach', done: w => { takeSlice(f); hold(w, 'left', plateWith([f])); } });
    b.jobs.push({ spot: c.till.spot, dur: 0.5, done: w => handoff(w, c) });
  }
  function handoff(w, c) {
    hold(w, 'cup', false); hold(w, 'left', null);
    if (c && customers.includes(c) && c.till) { settle(c); w.p.hop = 0.8; }
    w.current = null; w.idleT = R(1, 3);
  }
  const iceMachine = { open: 0, want: 0 };
  function planIceRun() {
    if (state.ice > 0.35 || baristas.some(b => b.iceRun)) return;
    const idle = baristas.filter(b => !busy(b) && b.scale > 0.5);
    if (!idle.length) return;
    idle.sort((a, b) => a.pos.x - b.pos.x);                 // the one nearest the stock room goes
    const b = idle[0]; b.iceRun = true;
    b.jobs.push(
      { spot: SPOT.ice, dur: 1.6, pose: 'reach', start: () => { iceMachine.want = 1; }, done: w => { iceMachine.want = 0; hold(w, 'front', iceBucket()); } },
      { spot: SPOT.iceBin, dur: 0.8, pose: 'reach', done: w => { hold(w, 'front', null); state.ice = 1; w.iceRun = false; } },
    );
  }
  function assignOrders() {
    while (orders.length) {
      const idle = baristas.filter(b => !busy(b) && b.scale > 0.5);
      if (!idle.length) break;
      const c = orders.shift();
      if (!customers.includes(c) || !c.till) continue;
      const cold = c.order.drink && c.order.drink.coldBrew;
      // the idle barista whose station is nearest that customer's till (or nearest the cold-brew dispensers)
      const key = b => cold ? Math.abs(b.pos.x - URN_SPOT_X) : Math.abs(b.st.x - c.pos.x);
      idle.sort((a, b) => key(a) - key(b));
      planDrinks(idle[0], c);
    }
  }

  function updateBaristas(dt) {
    if (state.ice < 0.2) planIceRun();                       // nearly out: ice before the next order
    assignOrders();
    planIceRun();
    const open = isOpen(state.hour), on = lightsOn(state.hour);
    for (const b of baristas) {
      b.scale += ((on ? 1 : 0) - b.scale) * (1 - Math.exp(-dt * 6));
      let moving = runJobs(b, dt, 1.9);
      if (!busy(b)) {
        // an idle barista steps back against the back counter to let a busy colleague past
        const passing = staff.some(o => o !== b && o.walking && Math.abs(o.pos.x - b.pos.x) < 1.6 && Math.abs(o.pos.z - LANE_Z) < 0.6);
        const spotBack = v3(b.pos.x, LANE_Z - 0.28);
        if (passing && !b.path.length && b.pos.z > LANE_Z - 0.2 && !baristas.some(o => o !== b && o.pos.distanceTo(spotBack) < 0.6)) b.path = [spotBack];
        b.idleT -= dt;
        if (b.idleT <= 0) { b.idleT = R(3, 7); b.path = [v3(b.st.x + R(-0.9, 0.9), LANE_Z - 0.26)]; }
        moving = walk(b, dt, 0.9);
        if (!moving) b.p.face = 0;
      }
      const brewing = !!(b.job && b.phase === 'act' && b.job.pose === 'brew');
      const atMachine = brewing && b.job.brew;
      b.p.outer.position.set(b.pos.x, 0, b.pos.z);
      b.p.outer.scale.setScalar(Math.max(0.001, b.scale) * PERSON_SCALE);
      animatePerson(b.p, { moving: moving && b.stepping !== false, cup: b.hands.cup, left: b.hands.left, front: b.hands.front, pose: b.pose }, dt);
      b.st.steam.forEach(e => { e.rate = atMachine ? 9 : (open ? 0.9 : 0); });
      b.st.lampMat.color.setHex(atMachine ? 0xffa64d : (open ? 0x6b4a2a : 0x2a2018));
      // progress ring over the barista's head while a drink is being made
      const pr = b.prog;
      pr.k += ((brewing ? 1 : 0) - pr.k) * (1 - Math.exp(-dt * 12));
      pr.sprite.visible = pr.k > 0.02;
      pr.sprite.scale.set(0.85 * pr.k + 0.001, 0.85 * pr.k + 0.001, 1);
      pr.sprite.position.set(b.pos.x, 2.75, b.pos.z);
    }
  }

  /* ---------- the baker: knead → oven → cooling rack → bread tables; restocks the cake showcase from the fridge ---------- */
  const bakery = { rackReady: true, toastAt: -99 };
  const showRack = on => rackBread.forEach(t => { t.visible = on; });
  showRack(true);
  const dessertsLeft = () => DESSERTS.reduce((s, f) => s + f.avail, 0);
  function planBaker(w) {
    const stock = breadStock();
    if (bakery.rackReady && stock <= BREAD_FULL - 6) {
      // a cooled batch is waiting and the tables are getting bare: take it out front
      w.jobs.push({ spot: SPOT.rack, dur: 0.8, pose: 'reach', done: w => { bakery.rackReady = false; showRack(false); hold(w, 'front', bakeTray(BREADS[0], 6)); } });
      breadTables.forEach((t, i) => w.jobs.push({
        spot: t.refill, dur: 1.6, pose: 'reach',
        done: w => {
          t.baskets.forEach(b => { b.count = 3; syncBasket(b); });
          if (i === breadTables.length - 1) {
            hold(w, 'front', null);
            if (elapsed - bakery.toastAt > 40) { bakery.toastAt = elapsed; toast('Fresh bread is out!', 'gold', 'bread'); }
          }
        },
      }));
    } else if (oven.state === 'done' && !bakery.rackReady) {
      w.jobs.push(
        { spot: SPOT.oven, dur: 1.3, pose: 'reach', start: () => { oven.want = 1; }, done: w => { oven.want = 0; oven.state = 'idle'; hold(w, 'front', bakeTray(BREADS[0], 6)); } },
        { spot: SPOT.rack, dur: 1.0, pose: 'reach', done: w => { hold(w, 'front', null); bakery.rackReady = true; showRack(true); } },
      );
    } else if (DESSERTS.some(f => f.avail === 0) || dessertsLeft() <= 8) {
      w.jobs.push(
        { spot: SPOT.fridge, dur: 1.4, pose: 'reach', start: () => { fridges[1].want = 1; }, done: w => { fridges[1].want = 0; hold(w, 'front', boxOf(0xffd0de, 0.34, 0.18, 0.26, 0xff6f59)); } },
        { spot: SPOT.showcase, dur: 2.0, pose: 'reach', done: w => {
          hold(w, 'front', null);
          DESSERTS.forEach(f => { f.avail = 4; f.shown = 4; f.slots.forEach(m => { m.visible = true; }); });
        } },
      );
    } else if (oven.state === 'idle' && (!bakery.rackReady || stock < BREAD_FULL)) {
      // keep one batch in the oven while bread is selling; it waits there (warm) until the rack is free
      w.jobs.push(
        { spot: SPOT.knead, dur: 5, pose: 'knead',
          tick: (w, u) => { const q = Math.sin(u * 34); dough.scale.set(1 + 0.18 * q, 0.65 - 0.12 * q, 1 + 0.1 * q); },
          done: w => { dough.scale.set(1, 0.65, 1); hold(w, 'front', bakeTray(null, 6)); } },
        { spot: SPOT.oven, dur: 1.2, pose: 'reach', start: () => { oven.want = 1; }, done: w => { oven.want = 0; hold(w, 'front', null); oven.state = 'baking'; oven.t = 16; } },
      );
    }
  }

  /* ---------- the roaster: green beans → hopper → roast → cooling tray → grinders (or the retail table) ---------- */
  const ROAST_T = 12, COOL_T = 6;
  const roast = { state: 'idle', t: 0, heat: 0, bags: 2, toastAt: -99 };
  const syncBags = () => tableBags.forEach((b, i) => { b.visible = i < roast.bags; });
  function planRoaster(w) {
    if (roast.state === 'cooled') {
      w.jobs.push({ spot: SPOT.tray, dur: 1.6, pose: 'reach', done: w => { roast.state = 'idle'; trayBeans.visible = false; hold(w, 'front', beanBag()); } });
      const low = stations.filter(st => st.beans < 0.6).sort((a, b) => a.beans - b.beans)[0];
      if (low) w.jobs.push({ spot: low.grinderSpot, dur: 1.0, pose: 'up', done: w => { low.beans = 1; hold(w, 'front', null); } });
      else w.jobs.push({ spot: SPOT.bag, dur: 1.4, pose: 'reach', done: w => { hold(w, 'front', null); roast.bags = Math.min(tableBags.length, roast.bags + 1); syncBags(); } });
    } else if (roast.state === 'idle') {
      w.jobs.push(
        { spot: SPOT.pallet, dur: 1.0, pose: 'reach', done: w => hold(w, 'front', beanSack()) },
        { spot: SPOT.hopper, dur: 1.4, pose: 'up', done: w => { hold(w, 'front', null); roast.state = 'charged'; hopperBeans.scale.y = 1; } },
        { spot: SPOT.panel, dur: 1.0, pose: 'reach', done: () => { roast.state = 'roasting'; roast.t = ROAST_T; } },
      );
    } else {
      w.jobs.push({ spot: SPOT.panel, dur: R(2, 4), pose: Math.random() < 0.5 ? 'reach' : null });   // keep an eye on the roast
    }
  }

  function updateBackOfHouse(dt) {
    const h = state.hour;
    for (const w of [baker, roaster]) {
      // the roaster doesn't walk away from a roast in progress
      const on = onShift(w, h) || (w === roaster && (roast.state === 'charged' || roast.state === 'roasting' || roast.state === 'cooling'));
      if (!busy(w)) {
        if (on) (w === baker ? planBaker : planRoaster)(w);
        if (!busy(w) && w.at !== w.home) w.jobs.push({ spot: w.home, dur: 0.2 });   // nothing to do: back to their own corner
      }
      const visible = on || busy(w);
      w.scale += ((visible ? 1 : 0) - w.scale) * (1 - Math.exp(-dt * 5));
      const moving = runJobs(w, dt, 1.6);
      if (!busy(w) && !moving && on) {
        // nothing urgent: the baker shapes dough at the work table now and then
        w.idleT -= dt;
        if (w === baker && w.idleT <= 0) { w.idleT = R(3, 6); w.jobs.push({ spot: SPOT.knead, dur: R(3, 5), pose: 'knead' }); }
      }
      w.p.outer.position.set(w.pos.x, 0, w.pos.z);
      w.p.outer.scale.setScalar(Math.max(0.001, w.scale) * PERSON_SCALE);
      animatePerson(w.p, { moving: moving && w.stepping !== false, cup: w.hands.cup, left: w.hands.left, front: w.hands.front, pose: w.pose }, dt);
    }
  }

  /* ---------- machines: oven, roaster, fridges, ice machine, drip towers ---------- */
  const OVEN_COLD = new THREE.Color(0x4a2a1a), OVEN_HOT = new THREE.Color(0xffa040);
  const DRUM_COLD = new THREE.Color(0x3a2418), DRUM_HOT = new THREE.Color(0xff7a2e);
  const roastSmoke = makeEmitter(chimneyTop.x, chimneyTop.y, chimneyTop.z, 'smoke');
  const trayVapour = makeEmitter(CT_X, 0.95, CT_Z);
  const ovenVapour = makeEmitter(OVEN_X + 0.55, 1.6, OVEN_Z);
  function updateMachines(dt) {
    // deck oven
    if (oven.state === 'baking') { oven.t -= dt; if (oven.t <= 0) oven.state = 'done'; }
    const heat = oven.state === 'baking' ? 1 : oven.state === 'done' ? 0.55 + 0.25 * Math.sin(elapsed * 4) : 0.08;
    oven.glow += (heat - oven.glow) * (1 - Math.exp(-dt * 2));
    ovenGlowMat.color.copy(OVEN_COLD).lerp(OVEN_HOT, oven.glow);
    oven.open += (oven.want - oven.open) * (1 - Math.exp(-dt * 6));
    ovenDoors.forEach(d => { d.rotation.z = -1.0 * oven.open; });
    ovenVapour.rate = oven.open > 0.4 ? 10 : 0;

    // drum roaster
    if (roast.state === 'roasting') {
      roast.t -= dt;
      hopperBeans.scale.y = Math.max(0.001, 1 - (ROAST_T - roast.t) / 2.5);       // beans drop into the drum
      if (roast.t <= 0) { roast.state = 'cooling'; roast.t = COOL_T; trayBeans.visible = true; hopperBeans.scale.y = 0.001; }
    } else if (roast.state === 'cooling') {
      roast.t -= dt;
      if (roast.t <= 0) {
        roast.state = 'cooled';
        if (elapsed - roast.toastAt > 60) { roast.toastAt = elapsed; toast('Fresh roast!', 'mint', 'bean'); }
      }
    }
    const roasting = roast.state === 'roasting';
    roast.heat += ((roasting ? 1 : 0) - roast.heat) * (1 - Math.exp(-dt * 0.8));
    roastGlowMat.color.copy(DRUM_COLD).lerp(DRUM_HOT, roast.heat);
    const running = roaster.scale > 0.05 || roasting;
    paddle.rotation.z -= dt * (roasting ? 6 : running ? 1.2 : 0);
    stirrer.rotation.y += dt * (roast.state === 'cooling' ? 3 : roast.state === 'cooled' ? 1 : 0);
    roastSmoke.rate = roasting ? 1.2 + 3.5 * roast.heat : 0;
    trayVapour.rate = roast.state === 'cooling' ? 6 : 0;
    needlePivot.rotation.x = -1.2 + 2.4 * (roasting ? 1 - roast.t / ROAST_T : roast.heat);
    roastLamps[0].m.color.copy(running ? roastLamps[0].on : roastLamps[0].off);
    roastLamps[1].m.color.copy(roasting && Math.sin(elapsed * 6) > 0 ? roastLamps[1].on : roastLamps[1].off);
    roastLamps[2].m.color.copy(roast.state === 'cooled' ? roastLamps[2].on : roastLamps[2].off);

    // fridge doors and the ice-machine scoop door
    fridges.forEach(f => { f.open += (f.want - f.open) * (1 - Math.exp(-dt * 6)); f.hinge.rotation.y = 1.25 * f.open; });
    iceMachine.open += (iceMachine.want - iceMachine.open) * (1 - Math.exp(-dt * 6));
    iceDoor.rotation.x = -0.18 - 0.9 * iceMachine.open;
    iceFill.scale.y = Math.max(0.05, state.ice);
    stations.forEach(st => { st.beanMesh.scale.y = Math.max(0.08, st.beans); });

    // slow-drip towers: a drop every so often, carafes filling over the day
    drips.forEach(d => {
      d.level += dt * 0.004; if (d.level > 1) d.level = 0.15;
      d.fill.scale.y = d.level;
      const u = (elapsed * 1.1 + d.phase) % 1;
      d.d1.position.y = 0.88 - 0.08 * u; d.d1.visible = u < 0.95;
      const u2 = (elapsed * 0.9 + d.phase + 0.5) % 1;
      d.d2.position.y = 0.39 - (0.39 - (0.02 + 0.22 * d.level)) * u2; d.d2.visible = u2 < 0.95;
    });
  }

  /* ---------- time of day ---------- */
  const C = (h) => new THREE.Color(h);
  const NIGHT = C(0x24305e), DAY = C(0x7cc4e6), DUSK = C(0xffa070), SUN_DAY = C(0xffffff), SUN_DUSK = C(0xffb07a);
  const STREET_DAY = C(0x8a99a6), STREET_NIGHT = C(0x141a30);
  const HEMI_DAY = C(0xfff6e6), HEMI_NIGHT = C(0x7d86c8);
  const tmp = new THREE.Color();
  let signOpen = null, lampFade = 1, dayAmt = 1;

  function updateDay(h) {
    const day = clamp(Math.sin(Math.PI * clamp((h - 5.6) / 14.8, 0, 1)), 0, 1);
    dayAmt = day;
    const dusk = clamp(Math.exp(-(((h - 19.1) / 0.85) ** 2)) + 0.8 * Math.exp(-(((h - 6.5) / 0.6) ** 2)), 0, 1);
    const p = clamp((h - 6) / 14, 0, 1);
    sun.position.set(15 - 38 * p, 4 + 19 * Math.sin(Math.PI * p), 13);
    // cap the midday peak: toon shading has no tone mapping, so sun + sky above ~1.0 burns out to white
    sun.intensity = 0.62 * Math.pow(day, 0.6) * (1 - 0.18 * Math.max(0, Math.sin(Math.PI * clamp((h - 9) / 6, 0, 1))));
    sun.color.copy(SUN_DAY).lerp(SUN_DUSK, dusk * 0.8);
    hemi.intensity = 0.3 + 0.2 * day;
    hemi.color.copy(HEMI_NIGHT).lerp(HEMI_DAY, day);
    moon.intensity = 0.32 * (1 - day);
    scene.background.copy(NIGHT).lerp(DAY, day).lerp(DUSK, dusk * 0.55);
    skyMat.color.copy(NIGHT).lerp(DAY, day).lerp(DUSK, dusk * 0.65);
    streetMat.color.copy(STREET_NIGHT).lerp(STREET_DAY, day);
    litMat.opacity = clamp(1 - day * 1.6, 0, 0.9);

    const on = lightsOn(h) || baker.scale > 0.05 || roaster.scale > 0.05;   // the early baker switches the lights on too
    lampFade += ((on ? 1 : 0) - lampFade) * 0.06;
    const lampLevel = 0.05 + lampFade * (0.5 + 0.9 * (1 - day));
    lamps.forEach(l => { l.intensity = l.userData.base * lampLevel; });
    tmp.setRGB(1, 0.85, 0.6).multiplyScalar(0.3 + lampFade * 0.75);
    pendants.forEach(pd => pd.bulbMat.color.copy(tmp));
    const streetOn = 1 - clamp(day * 2.2, 0, 1);
    streetLight.intensity = 1.6 * streetOn;
    streetBulbMat.color.setRGB(0.55 + 0.45 * streetOn, 0.5 + 0.38 * streetOn, 0.38 + 0.2 * streetOn);

    const open = isOpen(h);
    if (open !== signOpen) { signOpen = open; signMat.map = open ? openTex : closedTex; signMat.needsUpdate = true; }
  }

  /* ---------- HUD ---------- */
  const el = id => document.getElementById(id);
  const ui = { clock: el('clock'), status: el('status'), served: el('served'), baked: el('baked'), inline: el('inline'), seated: el('seated'), seatcap: el('seatcap'), seatpill: el('seatpill'), revenue: el('revenue'), day: el('day'), dayico: el('dayico'), time: el('time'), play: el('play'), orbit: el('orbit'), reset: el('reset'), toasts: el('toasts') };
  let dragging = false;
  ui.time.addEventListener('pointerdown', () => { dragging = true; });
  window.addEventListener('pointerup', () => { dragging = false; });
  ui.time.addEventListener('input', () => { state.hour = Math.min(parseFloat(ui.time.value), 23.999); });
  function syncPlay() {
    ui.play.innerHTML = `<svg><use href="#i-${state.playing ? 'pause' : 'play'}"/></svg>`;
    ui.play.setAttribute('aria-label', state.playing ? 'Pause clock' : 'Run clock');
    ui.play.setAttribute('aria-pressed', String(!state.playing));
  }
  ui.play.addEventListener('click', () => { state.playing = !state.playing; syncPlay(); });
  ui.orbit.addEventListener('click', () => {
    controls.autoRotate = !controls.autoRotate;
    ui.orbit.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  ui.reset.addEventListener('click', () => { camera.position.copy(HOME); controls.target.copy(HOME_TARGET); camera.zoom = 1; camera.updateProjectionMatrix(); controls.update(); });
  syncPlay();

  function segmented(id, onSelect) {
    const buttons = Array.from(document.querySelectorAll(`#${id} button`));
    const select = btn => { buttons.forEach(b => b.setAttribute('aria-checked', String(b === btn))); onSelect(btn); };
    buttons.forEach((b, i) => {
      b.addEventListener('click', () => select(b));
      b.addEventListener('keydown', e => {
        const step = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!step) return;
        e.preventDefault();
        const next = buttons[(i + step + buttons.length) % buttons.length];
        select(next); next.focus();
      });
    });
  }
  segmented('shop', btn => {
    const wasOpen = isOpen(state.hour);
    state.mode = btn.dataset.mode;
    if (!wasOpen && isOpen(state.hour)) state.spawnIn = 0.8;
    last.open = null;
  });
  segmented('speed', btn => { state.speed = parseFloat(btn.dataset.speed); });

  // game-style banners
  function toast(text, kind, icon) {
    const t = document.createElement('div');
    t.className = 'toast ' + kind;
    t.innerHTML = `<span class="ico"><svg><use href="#i-${icon}"/></svg></span><span></span>`;
    t.lastChild.textContent = text;
    ui.toasts.appendChild(t);
    while (ui.toasts.children.length > 2) ui.toasts.firstChild.remove();
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 400); }, 2300);
  }

  let last = { clock: '', served: -1, baked: -1, inline: -1, seated: -1, open: null, revenue: -1, day: -1, night: null };
  ui.seatcap.textContent = `/ ${chairs.length} seated`;
  ui.seatpill.title = `Seats taken, out of ${chairs.length}`;
  function updateHud() {
    const hh = Math.floor(state.hour), mm = Math.floor((state.hour - hh) * 60);
    const clock = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    if (clock !== last.clock) { ui.clock.textContent = clock; last.clock = clock; }
    if (!dragging) ui.time.value = state.hour.toFixed(2);
    const open = isOpen(state.hour);
    if (open !== last.open) {
      ui.status.querySelector('span').textContent = open ? 'Open' : 'Closed';
      const old = ui.status.querySelector('small'); if (old) old.remove();
      if (state.mode !== 'hours') { const n = document.createElement('small'); n.textContent = '· manual'; ui.status.appendChild(n); }
      ui.status.classList.toggle('closed', !open); last.open = open;
    }
    if (state.served !== last.served) { ui.served.textContent = state.served; last.served = state.served; }
    if (state.baked !== last.baked) { ui.baked.textContent = state.baked; last.baked = state.baked; }
    if (state.revenue !== last.revenue) { ui.revenue.textContent = state.revenue.toLocaleString('en-US'); last.revenue = state.revenue; }
    if (state.day !== last.day) { ui.day.textContent = state.day; last.day = state.day; }
    if (queue.length !== last.inline) { ui.inline.textContent = queue.length; last.inline = queue.length; }
    const seatedN = chairs.filter(c => c.taken).length;
    if (seatedN !== last.seated) { ui.seated.textContent = seatedN; last.seated = seatedN; }
    const night = dayAmt < 0.2;
    if (night !== last.night) {
      ui.dayico.innerHTML = `<svg><use href="#i-${night ? 'moon' : 'sun'}"/></svg>`;
      ui.dayico.classList.toggle('night', night); last.night = night;
    }
  }

  // redraw canvas text once the web fonts arrive
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('60px "Lilita One"'),
      document.fonts.load('800 30px "Nunito"'),
    ]).then(() => {
      seed = 99; drawMenu(menuTex.userData.canvas.getContext('2d'), 1024, 400); menuTex.needsUpdate = true;
      drawBakeryBoard(bakeryBoardTex.userData.canvas.getContext('2d'), 256, 352); bakeryBoardTex.needsUpdate = true;
      plaques.forEach(q => { const old = q.m.map; q.m.map = plaqueTex(q.text, q.bg, q.fg); q.m.needsUpdate = true; old.dispose(); });
      openTex = signTex('OPEN', '#ffb35c', '#7a5a33'); closedTex = signTex('CLOSED', '#8a949a', '#3b4246');
      signOpen = null;
      textTexCache.forEach(t => t.dispose()); textTexCache.clear();
    }).catch(() => {});
  }

  /* ---------- loop ---------- */
  const HOURS_PER_SEC = 1 / 10;   // one in-shop hour every 10 seconds at 1×
  const clockT = new THREE.Clock();
  for (let i = 0; i < 4; i++) { const c = spawnCustomer(true); c.pos.copy(QUEUE[i]); c.path = []; c.state = 'queue'; c.scale = 1; }   // a few regulars already in line
  baker.scale = roaster.scale = onShift(baker, state.hour) ? 1 : 0;

  let prevOpen = isOpen(state.hour);
  function step(dt) {
    elapsed += dt;
    const before = state.hour;
    if (state.playing) {
      state.hour += dt * HOURS_PER_SEC;
      if (state.hour >= 24) {
        state.hour -= 24; state.served = 0; state.baked = 0; state.revenue = 0; state.day++;
        toast(`Day ${state.day}`, 'blue', 'star');
      }
      const crossed = t => before < t && state.hour >= t;
      if (isOpen(state.hour)) {
        if (crossed(8)) toast('Morning rush!', 'gold', 'ppl');
        if (crossed(12.25)) toast('Lunch rush!', 'gold', 'ppl');
      }
    }
    // who is on their feet this tick (seated customers and people fading out don't block anyone)
    crowd.length = 0;
    for (const w of staff) if (w.scale > 0.3) crowd.push(w);
    for (const c of customers) if (c.scale > 0.3 && c.state !== 'sitting' && c.state !== 'exit') crowd.push(c);
    for (const a of crowd) a.walking = a.path.length > 0 && !(a.waitHop > 0);
    updateCustomers(dt);
    updateBaristas(dt);
    updateBackOfHouse(dt);
    updateMachines(dt);
    for (const e of emitters) {
      e.acc += e.rate * dt;
      while (e.acc >= 1) { e.acc -= 1; emit(e.x, e.y, e.z, e.kind === 'smoke' ? 0.8 : e.rate > 3 ? 1 : 0.7, e.kind); }
    }
    updatePuffs(dt);
    updatePopups(dt);
  }

  function tick() {
    const simDt = Math.min(clockT.getDelta(), 0.05) * state.speed;
    const slices = Math.max(1, Math.ceil(simDt / (1 / 30)));
    for (let i = 0; i < slices; i++) step(simDt / slices);
    const openNow = isOpen(state.hour);
    if (openNow !== prevOpen) {
      toast(openNow ? 'Open for business!' : 'Closed for the night', openNow ? 'mint' : 'coral', 'store');
      prevOpen = openNow;
    }
    updateDay(state.hour);
    pendants.forEach(pd => { pd.g.rotation.z = Math.sin(elapsed * 0.7 + pd.phase) * 0.025; pd.g.rotation.x = Math.cos(elapsed * 0.55 + pd.phase) * 0.02; });
    controls.update();
    updateHud();
    if (effect) effect.render(scene, camera); else renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // for poking around in dev tools
  window.__cafe = {
    state, customers, baristas, baker, roaster, oven, roast, breadTables, DESSERTS, camera, controls, scene, renderer,
    setHour: h => { state.hour = clamp(h, 0, 23.999); },
    advance(seconds) { for (let t = 0; t < seconds; t += 1 / 30) step(1 / 30); },   // fast-forward the simulation without drawing
    look(x, z, zoom = 2.5) {
      const d = HOME.clone().sub(HOME_TARGET);
      controls.target.set(x, 0.6, z); camera.position.copy(controls.target).add(d); camera.zoom = zoom; camera.updateProjectionMatrix(); controls.update();
    },
  };
})();
</script>
