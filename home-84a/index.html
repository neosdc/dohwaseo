<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>우리 집 84A</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  /* Layout: full-bleed WebGL stage; status card pinned top-left, control bar along the bottom, room name tags float over the model */
  --bg:#e3e7ea;
  --panel:rgba(250,250,248,.9);
  --fg:#22262a;
  --muted:#626b72;
  --line:rgba(34,38,42,.15);
  --accent:#a9742c;
  --on:#2f7a52;
  --tag:rgba(255,255,255,.92);
  --tag-fg:#2b2f33;
  --font-display:"Gowun Batang","Nanum Myeongjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1316; --panel:rgba(20,24,28,.88); --fg:#e8ebee; --muted:#9aa3ab; --line:rgba(232,235,238,.16);
    --accent:#e0a95a; --on:#6cc896; --tag:rgba(24,28,32,.88); --tag-fg:#e8ebee; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1316; --panel:rgba(20,24,28,.88); --fg:#e8ebee; --muted:#9aa3ab; --line:rgba(232,235,238,.16);
  --accent:#e0a95a; --on:#6cc896; --tag:rgba(24,28,32,.88); --tag-fg:#e8ebee; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);overflow:hidden}
.stage{position:relative;height:100%;overflow:hidden;background:var(--bg)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font:600 .74rem/1 var(--font-body);color:var(--tag-fg);
  background:var(--tag);border:1px solid var(--line);border-radius:999px;padding:5px 9px;white-space:nowrap;will-change:transform}
.tag.minor{font-weight:400;font-size:.68rem;color:var(--muted)}
.ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.card,.bar{pointer-events:auto;background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;color:var(--fg)}
.card{align-self:flex-start;padding:14px 16px;display:grid;gap:12px;min-width:0;max-width:100%}
h1{margin:0;font:700 1.45rem/1.1 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;font-size:.78rem;color:var(--muted)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat{display:grid;gap:5px;min-width:0}
.lbl{font:500 .64rem/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.k{font:600 .66rem/1 var(--font-body);color:var(--muted)}
.val{font:600 1.2rem/1 var(--font-mono);font-variant-numeric:tabular-nums}
.val.txt{font:600 1rem/1.1 var(--font-body)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:2px}
.dot.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
.bar{display:flex;align-items:center;gap:8px;padding:9px;flex-wrap:wrap}
button{font:600 .8rem/1 var(--font-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#1b1408}
button.primary[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--line);border-radius:11px}
.seg .k{padding:0 6px 0 5px}
.seg button{border:0;border-radius:8px;padding:7px 9px}
.seg button[aria-checked="true"]{background:var(--fg);color:var(--bg)}
.timeline{display:flex;align-items:center;gap:8px;flex:1 1 200px;min-width:0}
.timeline .lbl{font-variant-numeric:tabular-nums}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.hint{font:400 .7rem/1.3 var(--font-body);color:var(--muted)}
@media (max-width:640px){.hint{display:none}.val{font-size:1.05rem}.stats{gap:12px}h1{font-size:1.2rem}.tag{font-size:.66rem;padding:4px 7px}.tag.minor{display:none}}
</style>

<div class="stage" id="stage">
  <canvas id="c" aria-label="부천일루미스테이트 84A 확장형 평면을 바탕으로 만든 집 3D 모형"></canvas>
  <div class="labels" id="labels"></div>
  <div class="ui">
    <section class="card">
      <div>
        <h1>우리 집</h1>
        <p class="sub">부천일루미스테이트 84A · 확장형 평면</p>
      </div>
      <div class="stats">
        <div class="stat"><span class="k">시각</span><span class="val" id="clock">14:00</span></div>
        <div class="stat"><span class="k">태양 (거실 창 남향 기준)</span><span class="val txt" id="sun">고도 40° · 남</span></div>
        <div class="stat"><span class="k">조명</span><span class="val txt" id="lights"><span class="dot"></span>꺼짐</span></div>
        <div class="stat"><span class="k">보는 곳</span><span class="val txt" id="where">전체</span></div>
      </div>
    </section>
    <footer class="bar">
      <button id="tour" type="button" class="primary" aria-pressed="false">집 둘러보기</button>
      <button id="play" type="button">시계 멈춤</button>
      <label class="timeline" for="time">
        <span class="lbl">00:00</span>
        <input id="time" type="range" min="0" max="24" step="0.05" value="14" aria-label="시각">
        <span class="lbl">24:00</span>
      </label>
      <div class="seg" id="lightmode" role="radiogroup" aria-label="조명">
        <span class="k">조명</span>
        <button type="button" role="radio" data-v="auto" aria-checked="true" title="해가 지면 켜지고 자정 무렵 꺼집니다">자동</button>
        <button type="button" role="radio" data-v="on" aria-checked="false">켜기</button>
        <button type="button" role="radio" data-v="off" aria-checked="false">끄기</button>
      </div>
      <div class="seg" id="wallmode" role="radiogroup" aria-label="벽 높이">
        <span class="k">벽</span>
        <button type="button" role="radio" data-v="full" aria-checked="true">전체</button>
        <button type="button" role="radio" data-v="cut" aria-checked="false">낮게</button>
      </div>
      <button id="furn" type="button" aria-pressed="true" title="실제 가구가 아닌 배치 예시입니다">가구 예시</button>
      <button id="mirror" type="button" aria-pressed="true" title="평면을 좌우로 뒤집습니다">좌우 반전</button>
      <button id="orbit" type="button" aria-pressed="false" title="집 주위를 천천히 돌며 봅니다">자동 회전</button>
      <button id="reset" type="button">처음 시점</button>
      <span class="hint">문 클릭: 열기·닫기 · 드래그 회전 · 스크롤 확대 · 우클릭 드래그 이동</span>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/geometries/RoundedBoxGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('c');
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

  /* ---------- renderer / camera ---------- */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  let envTex = null;
  if (THREE.RoomEnvironment) envTex = new THREE.PMREMGenerator(renderer).fromScene(new THREE.RoomEnvironment(), 0.04).texture;
  scene.background = new THREE.Color(0xa9cbe6);
  scene.fog = new THREE.Fog(0xa9cbe6, 45, 120);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 300);
  const HOME = new THREE.Vector3(7.5, 15.5, 13.5);
  const HOME_T = new THREE.Vector3(0, 0, 0.6);
  camera.position.copy(HOME);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.copy(HOME_T);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 2; controls.maxDistance = 48;
  controls.maxPolarAngle = Math.PI * 0.495;

  let baseFov = 40;
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    baseFov = camera.aspect >= 1.15 ? 40 : Math.min(66, 40 * 1.15 / camera.aspect * 0.8);
    if (!tour.active) camera.fov = baseFov;
    camera.updateProjectionMatrix();
  }

  /* ---------- plan coordinates ----------
     All geometry is written in pixels of the builder's 84A expanded-type plan image,
     then scaled: 1 px = 4.2 cm (living room 100 px ≈ 4.2 m). Plan x → world +X (east),
     plan y → world +Z (south, toward the living-room window). */
  const S = 0.042;
  const PCX = (31 + 293) / 2, PCY = (258 + 494) / 2;
  const mx = x => (x - PCX) * S;
  const mz = y => (y - PCY) * S;
  const H = 2.3;            // ceiling height
  let CUT = H;              // current wall height (cutaway lowers it)

  const house = new THREE.Group(); scene.add(house);
  const built = new THREE.Group(); house.add(built);      // rebuilt when wall height changes
  const doors = [];                                        // hinged doors currently in the scene
  function applyDoor(o) {
    const a = o.maxAngle * o.cur;
    o.pivot.rotation.y = o.horiz ? -a : -Math.PI / 2 + a;
  }
  function updateDoors(dt) {
    const k = 1 - Math.exp(-dt * 7);
    for (const o of doors) {
      const target = o.isOpen ? 1 : 0;
      if (Math.abs(target - o.cur) < 0.001) { if (o.cur !== target) { o.cur = target; applyDoor(o); } continue; }
      o.cur += (target - o.cur) * k; applyDoor(o);
    }
  }
  const furn = new THREE.Group(); house.add(furn);

  /* ---------- textures ---------- */
  let seed = 84;
  const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  function canvasTex(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
    return t;
  }
  function tileTex(n, base, vary, grout, veins) {
    return canvasTex(512, 512, (g, w, h) => {
      const s = w / n;
      g.fillStyle = grout; g.fillRect(0, 0, w, h);
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        const l = base[2] + (srand() - 0.5) * vary;
        g.fillStyle = `hsl(${base[0]} ${base[1]}% ${l}%)`;
        g.fillRect(i * s + 1.5, j * s + 1.5, s - 3, s - 3);
        for (let k = 0; k < 30; k++) {
          g.fillStyle = `rgba(${srand() < 0.5 ? '255,255,255' : '90,80,70'},${0.03 + srand() * 0.04})`;
          g.beginPath(); g.arc(i * s + srand() * s, j * s + srand() * s, 2 + srand() * 10, 0, 7); g.fill();
        }
        if (veins) {
          g.strokeStyle = `rgba(120,115,110,${0.18 + srand() * 0.15})`; g.lineWidth = 1 + srand();
          g.beginPath(); let x = i * s + srand() * s, y = j * s;
          g.moveTo(x, y);
          for (let q = 0; q < 6; q++) { x += (srand() - 0.4) * s * 0.3; y += s / 6; g.lineTo(x, y); }
          g.stroke();
        }
      }
    }, true);
  }
  // 600×600 porcelain tile: 4×4 tiles per texture = 2.4 m
  const floorTex = tileTex(4, [36, 22, 86], 3, '#bdb3a6', false);
  const marbleTex = tileTex(4, [30, 8, 93], 2, '#cfcac3', true);
  const bathTex = tileTex(8, [30, 4, 42], 4, '#34322f', false);
  const balcTex = tileTex(8, [210, 4, 66], 5, '#8f9296', false);
  const wallTileTex = tileTex(6, [33, 18, 82], 3, '#c6bcae', false);
  const stoneTex = canvasTex(512, 512, (g, w, h) => {   // living-room accent wall: large stone-look panels
    g.fillStyle = '#9d9283'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) {
      const x = i * 256, y = j * 256;
      g.fillStyle = `hsl(34 ${12 + srand() * 4}% ${66 + srand() * 5}%)`; g.fillRect(x + 2, y + 2, 252, 252);
      for (let k = 0; k < 140; k++) {
        g.fillStyle = `rgba(${srand() < 0.5 ? '255,250,240' : '110,98,84'},${0.04 + srand() * 0.05})`;
        g.fillRect(x + srand() * 250, y + srand() * 250, 2 + srand() * 30, 1 + srand() * 3);
      }
    }
  }, true);
  const graniteTex = tileTex(3, [25, 6, 30], 4, '#1d1c1b', false);
  const nicheTex = canvasTex(256, 192, (g, w, h) => {   // a lit wooden niche, seen straight on
    g.fillStyle = '#6e4a24'; g.fillRect(0, 0, w, h);
    const inner = g.createLinearGradient(0, 0, 0, h);
    inner.addColorStop(0, '#d79c55'); inner.addColorStop(1, '#8b5a2b');
    g.fillStyle = inner; g.fillRect(16, 16, w - 32, h - 32);
    const spot = g.createRadialGradient(w / 2, h - 30, 4, w / 2, h - 30, 110);
    spot.addColorStop(0, 'rgba(255,236,190,0.95)'); spot.addColorStop(1, 'rgba(255,200,120,0)');
    g.fillStyle = spot; g.fillRect(16, 16, w - 32, h - 32);
    g.fillStyle = 'rgba(255,245,215,0.95)'; g.beginPath(); g.arc(w / 2, 24, 7, 0, 7); g.fill();
  });
  const towerTex = canvasTex(256, 512, (g, w, h) => {
    g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
    for (let y = 8; y < h; y += 22) for (let x = 8; x < w; x += 30) {
      if (srand() < 0.55) { g.fillStyle = `rgba(255,${200 + srand() * 40},${130 + srand() * 60},${0.6 + srand() * 0.4})`; g.fillRect(x, y, 18, 12); }
    }
  });

  /* ---------- materials ---------- */
  const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0 }, o));
  const mats = {
    wall: M(0xf2f0eb, { roughness: 0.92 }),
    ceiling: M(0xf6f5f2, { roughness: 0.95 }),
    floor: M(0xffffff, { map: floorTex, roughness: 0.38 }),
    marble: M(0xffffff, { map: marbleTex, roughness: 0.22 }),
    bath: M(0xffffff, { map: bathTex, roughness: 0.6 }),
    balc: M(0xffffff, { map: balcTex, roughness: 0.8 }),
    wallTile: M(0xffffff, { map: wallTileTex, roughness: 0.4 }),
    stone: M(0xffffff, { map: stoneTex, roughness: 0.55 }),
    granite: M(0xffffff, { map: graniteTex, roughness: 0.35 }),
    cream: M(0xeae5db, { roughness: 0.6 }),          // doors and baseboards: cream, as in the photos
    white: M(0xf4f2ee, { roughness: 0.5 }),
    greige: M(0xc9c0b3, { roughness: 0.55 }),        // kitchen tall units / pantry
    quartz: M(0xf0ece4, { roughness: 0.25 }),
    frame: M(0x9a8c74, { roughness: 0.35, metalness: 0.6 }),   // champagne window frames
    steel: M(0x5c6064, { roughness: 0.45, metalness: 0.6 }),
    mirror: M(0x8e959b, { roughness: 0.04, metalness: 1 }),
    bronzeMirror: M(0x6e6358, { roughness: 0.05, metalness: 1 }),
    porcelain: M(0xfbfbfa, { roughness: 0.14 }),
    chrome: M(0xe4e7ea, { roughness: 0.12, metalness: 1 }),
    black: M(0x1c1c1d, { roughness: 0.3 }),
    sink: M(0xc7cacd, { roughness: 0.2, metalness: 0.9 }),
    glass: new THREE.MeshStandardMaterial({ color: 0xd8ecf2, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.16, depthWrite: false, side: THREE.DoubleSide }),
    slab: M(0x8b8e90, { roughness: 0.95 }),
    fabric: M(0x8d9096, { roughness: 1 }),
    linen: M(0xe8e4dc, { roughness: 1 }),
    wood: M(0xa27b52, { roughness: 0.6 }),
    rug: M(0xc8c0b3, { roughness: 1 }),
    washer: M(0xeceeef, { roughness: 0.3 }),
    unit: M(0xb9bcbf, { roughness: 0.6 }),
  };
  [['chrome', 0.9], ['porcelain', 0.35], ['mirror', 0.8], ['bronzeMirror', 0.6], ['sink', 0.7]].forEach(([k, i]) => { mats[k].envMap = envTex; mats[k].envMapIntensity = i; mats[k].userData.env = i; });
  const glowWarm = new THREE.MeshBasicMaterial({ color: 0xffc77f, toneMapped: false });
  const glowPanel = new THREE.MeshBasicMaterial({ color: 0xfff2dc, toneMapped: false });
  const nicheMat = new THREE.MeshBasicMaterial({ map: nicheTex, toneMapped: false });

  /* ---------- builder helpers (pixel space) ---------- */
  function shadowy(m) { m.castShadow = true; m.receiveShadow = true; return m; }
  // axis-aligned box from plan rect (x1,y1)-(x2,y2) and heights ya..yb, clipped to the current wall height
  function B(x1, y1, x2, y2, ya, yb, mat, parent = built, clip = true) {
    if (clip) yb = Math.min(yb, CUT);
    if (yb - ya <= 0.004) return null;
    const w = Math.abs(x2 - x1) * S, d = Math.abs(y2 - y1) * S;
    const m = new THREE.Mesh(new THREE.BoxGeometry(Math.max(w, 0.004), yb - ya, Math.max(d, 0.004)), mat);
    m.position.set(mx((x1 + x2) / 2), (ya + yb) / 2, mz((y1 + y2) / 2));
    shadowy(m);
    if (mat === mats.glass || mat.isMeshBasicMaterial) m.castShadow = false;   // light passes through glass and LED strips
    parent.add(m); return m;
  }
  // flat rect facing up (floors) or down (ceilings / ceiling lamps)
  function flat(x1, y1, x2, y2, y, mat, down = false, parent = built) {
    const w = (x2 - x1) * S, d = (y2 - y1) * S;
    const g = new THREE.PlaneGeometry(w, d);
    const m = new THREE.Mesh(g, mat);
    m.rotation.x = down ? Math.PI / 2 : -Math.PI / 2;
    m.position.set(mx((x1 + x2) / 2), y, mz((y1 + y2) / 2));
    m.receiveShadow = true; parent.add(m); return m;
  }
  // world-meter UVs so tile textures keep their real 600 mm size on any floor
  function meterUV(geo, size) {
    const p = geo.attributes.position, uv = geo.attributes.uv;
    for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / size, p.getY(i) / size);
    uv.needsUpdate = true;
  }
  function floorRect(x1, y1, x2, y2, mat, y = 0.004, size = 2.4) {
    const g = new THREE.PlaneGeometry((x2 - x1) * S, (y2 - y1) * S);
    g.translate(mx((x1 + x2) / 2), -mz((y1 + y2) / 2), 0);
    meterUV(g, size);
    const m = new THREE.Mesh(g, mat); m.rotation.x = -Math.PI / 2; m.position.y = y; m.receiveShadow = true;
    built.add(m); return m;
  }
  // a vertical wall-face plane with tiled texture in meters (for liners, accent wall)
  function liner(x1, y1, x2, y2, ya, yb, mat, size) {

  function makeTub(L, D) {

    const E = -Math.cos(decl) * Math.sin(ha);
    const N = Math.cos(LAT) * Math.sin(decl) - Math.sin(LAT) * Math.cos(decl) * Math.cos(ha);
    const U = Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(ha);
    return { E, N, U, alt: Math.asin(clamp(U, -1, 1)) / D2R, az: (Math.atan2(E, N) / D2R + 360) % 360 };
  }

  function updateSky(dt) {
    const s = sunAt(state.hour);
    const day = smooth(-4, 12, s.alt), twi = smooth(-8, 0, s.alt) * (1 - smooth(4, 16, s.alt));
    sun.position.set(s.E * 40, Math.max(s.U, 0.02) * 40, -s.N * 40);
    sun.intensity = 1.9 * smooth(-1, 8, s.alt);
    sun.color.copy(SUN_LOW).lerp(SUN_HIGH, smooth(4, 30, s.alt));
    hemi.intensity = 0.07 + 0.42 * day;
    tmpC.copy(SKY_NIGHT).lerp(SKY_DAY, day).lerp(SKY_TWI, twi * 0.7);
    scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
    groundMat.color.copy(GR_NIGHT).lerp(GR_DAY, smooth(-6, 10, s.alt));
    towerMat.emissiveIntensity = 0.9 * (1 - smooth(-6, 4, s.alt));
    towerMat.color.setScalar(0.25 + 0.6 * day);

    const want = lightsWanted(s.alt) ? 1 : 0;
    state.lampLevel += (want - state.lampLevel) * (1 - Math.exp(-dt * 3));
    const L = state.lampLevel;
    lamps.forEach(l => { l.intensity = l.userData.base * L * (1.0 + 0.6 * (1 - day)); });

    return s;
  }

  timeIn.addEventListener('pointerdown', () => { dragging = true; });
  window.addEventListener('pointerup', () => { dragging = false; });
  timeIn.addEventListener('input', () => { state.hour = Math.min(parseFloat(timeIn.value), 23.999); });

  function segmented(id, onSelect) {
    const buttons = Array.from(document.querySelectorAll(`#${id} button`));
    const select = b => { buttons.forEach(x => x.setAttribute('aria-checked', String(x === b))); onSelect(b.dataset.v); };
    buttons.forEach((b, i) => {
      b.addEventListener('click', () => select(b));
      b.addEventListener('keydown', e => {
        const st = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
        if (!st) return; e.preventDefault();
        const n = buttons[(i + st + buttons.length) % buttons.length]; select(n); n.focus();
      });
    });
    return v => buttons.forEach(x => x.setAttribute('aria-checked', String(x.dataset.v === v)));
  }
  segmented('lightmode', v => { state.lightMode = v; });
  const markWall = segmented('wallmode', v => setWall(v, true));
  function setWall(v, fromUi) {
    state.wall = v; CUT = v === 'cut' ? 1.15 : H; buildHouse();
    if (!fromUi) markWall(v);
  }
  const furnBtn = el('furn');
  furnBtn.addEventListener('click', () => { furn.visible = !furn.visible; furnBtn.setAttribute('aria-pressed', String(furn.visible)); });
  const mirrorBtn = el('mirror');
  mirrorBtn.addEventListener('click', () => {
    state.mirrored = !state.mirrored; house.scale.x = state.mirrored ? -1 : 1;
    mirrorBtn.setAttribute('aria-pressed', String(state.mirrored));
  });
  // auto-orbit: OrbitControls spins the camera around the current target; dragging still works while it runs
  const orbitBtn = el('orbit');
  controls.autoRotateSpeed = 0.8;   // about 75 s per full turn
  orbitBtn.addEventListener('click', () => {
    if (tour.active) { controls.target.copy(tour.to.tgt); stopTour(); }
    controls.autoRotate = !controls.autoRotate;
    orbitBtn.setAttribute('aria-pressed', String(controls.autoRotate));
  });
  el('reset').addEventListener('click', () => {
    if (tour.active) stopTour();
    camera.position.copy(HOME); controls.target.copy(HOME_T); camera.fov = baseFov; camera.updateProjectionMatrix(); controls.update();
  });

  let last = { clock: '', sun: '', lights: null };
  function updateHud(s) {
    const hh = Math.floor(state.hour), mm = Math.floor((state.hour - hh) * 60);
    const clock = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
    if (clock !== last.clock) { clockEl.textContent = clock; last.clock = clock; }
    if (!dragging) timeIn.value = state.hour.toFixed(2);
    const sunTxt = s.alt > -0.8 ? `고도 ${Math.round(s.alt)}° · ${DIRS[Math.round(s.az / 45) % 8]}` : '해 진 뒤';
    if (sunTxt !== last.sun) { sunEl.textContent = sunTxt; last.sun = sunTxt; }
    const on = state.lampLevel > 0.5;
    if (on !== last.lights) { lightsEl.innerHTML = `<span class="dot${on ? ' on' : ''}"></span>${on ? '켜짐' : '꺼짐'}`; last.lights = on; }
  }
  syncPlay(); syncTourBtn();

  /* ---------- go ---------- */
  buildHouse();
  buildFurniture();
  window.addEventListener('resize', resize);
  resize();

  const HOURS_PER_SEC = 1 / 12;   // one hour of daylight every 12 seconds
  const clk = new THREE.Clock();
  function tick() {
    const dt = Math.min(clk.getDelta(), 0.05);
    if (state.playing) { state.hour += dt * HOURS_PER_SEC; if (state.hour >= 24) state.hour -= 24; }
    const s = updateSky(dt);
    updateDoors(dt);
    if (tour.active) updateTour(dt); else controls.update();
    updateLabels();
    updateHud(s);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>

</body></html>
