<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>한울호 디오라마</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* layout: full-bleed WebGL stage over a drifting starfield; a game HUD frames it — title plate and controls on top, deck directory left, minimap and status at the bottom */
:root {
  --space-0: #060914;
  --space-1: #131a3a;
  --space-2: #2a1f4a;
  --ink: #ece9dd;
  --ink-dim: #9aa2bf;
  --signal: #ffb347;
  --ok: #7dffb0;
  --cyan: #58d6ff;
  --line: rgba(236, 233, 221, .2);
  --plate: rgba(9, 13, 30, .68);
  --font-display: 'Chakra Petch', 'IBM Plex Sans KR', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  overflow: hidden;
  color: var(--ink);
  font-family: var(--font-body);
  background:
    radial-gradient(120% 90% at 78% 12%, var(--space-2) 0%, transparent 55%),
    radial-gradient(110% 100% at 15% 95%, var(--space-1) 0%, transparent 60%),
    var(--space-0);
}
#sky, #stage { position: fixed; inset: 0; }
#sky { width: 100%; height: 100%; display: block; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }

.hud {
  position: fixed; inset: 0; z-index: 2; pointer-events: none;
  display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "list ." "map status";
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud > * { min-width: 0; }
.top { grid-area: top; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; justify-content: space-between; }
.panel {
  pointer-events: auto;
  background: var(--plate);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
}
.plate {
  padding: 10px 16px 10px 14px;
  background: var(--plate);
  border-left: 3px solid var(--signal);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  display: grid; gap: 2px;
}
.plate .code { margin: 0; font: 600 11px/1.4 var(--font-display); letter-spacing: .16em; color: var(--signal); }
.plate h1 { margin: 0; font: 700 26px/1.15 var(--font-display); letter-spacing: .02em; }
.plate .meta { margin: 0; font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.plate .clock { color: var(--ink); font-family: var(--font-display); font-weight: 600; letter-spacing: .06em; }

button {
  font: 600 12px/1 var(--font-display); letter-spacing: .06em;
  color: var(--ink); background: rgba(236, 233, 221, .07);
  border: 1px solid var(--line); border-radius: 0;
  padding: 8px 10px; min-height: 32px; cursor: pointer;
}
button:hover { background: rgba(236, 233, 221, .17); }
button[aria-pressed="true"], button[aria-expanded="true"] { background: var(--signal); border-color: var(--signal); color: var(--space-0); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px 8px 8px; align-items: center; }
.seg { display: flex; }
.seg button + button { border-left: 0; }
.seg svg { display: block; }

.rooms { grid-area: list; align-self: start; max-height: 100%; width: 212px; max-width: 100%; overflow-y: auto; padding: 8px 8px 12px; }
.rooms h2 { margin: 2px 4px 2px; font: 600 11px/1.4 var(--font-display); letter-spacing: .16em; color: var(--signal); }
.rooms h3 { margin: 10px 4px 2px; font: 600 10.5px/1.4 var(--font-body); letter-spacing: .12em; color: var(--ink-dim); }
.room {
  display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 6px; align-items: center;
  width: 100%; min-height: 0; padding: 6px 4px; text-align: left;
  background: transparent; border: 0; border-bottom: 1px solid rgba(236, 233, 221, .1);
  font: 400 12.5px/1.3 var(--font-body); letter-spacing: 0;
}
.room .rc { font: 600 10.5px/1 var(--font-display); letter-spacing: .04em; color: var(--ink-dim); }
.room .ro { font: 600 11px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ok); min-width: 1.4em; text-align: right; }
.room[aria-current="true"] { background: rgba(255, 179, 71, .22); }
.room[aria-current="true"] .rc { color: var(--signal); }

.mapbox { grid-area: map; justify-self: start; align-self: end; padding: 8px 10px 10px 8px; display: grid; gap: 6px; }
.sel { margin: 0; font-size: 12px; line-height: 1.4; color: var(--ink-dim); width: min(300px, calc(100vw - 52px)); }
.sel b { color: var(--signal); font: 600 11px/1 var(--font-display); letter-spacing: .06em; margin-right: 6px; }
.sel strong { color: var(--ink); font-weight: 600; }
#minimap { display: block; width: min(300px, calc(100vw - 52px)); aspect-ratio: 124 / 44; cursor: pointer; background: rgba(6, 9, 20, .55); }

.status { grid-area: status; align-self: end; padding: 10px 14px 10px 12px; font-size: 12px; max-width: 340px; }
.status dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
.status dt { font: 600 10.5px/1.4 var(--font-body); letter-spacing: .1em; color: var(--ink-dim); }
.status dd { margin: 0; font-variant-numeric: tabular-nums; }
.hint { margin: 8px 0 0; font-size: 11px; line-height: 1.5; color: var(--ink-dim); }

@media (max-width: 760px) {
  .hud { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "list" "map" "status"; gap: 8px; }
  .plate h1 { font-size: 20px; }
  .status { justify-self: start; padding: 6px 12px 6px 10px; }
  .hint { display: none; }
}
#fallback {
  position: fixed; inset: 0; z-index: 3;
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; color: var(--ink);
}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<div id="stage" role="img" aria-label="우주선 한울호 내부를 내려다본 3D 디오라마. 조종실, 전투정보실, 격납고, 무기고, 엔진실 등 26개 구획을 승무원과 로봇, 드론이 오가고 함재기가 발진과 귀환을 반복한다."></div>

<div class="hud">
  <div class="top">
    <div class="plate">
      <p class="code">ISV-07 · MAIN DECK</p>
      <h1>한울호</h1>
      <p class="meta"><span class="clock" id="clock">T+ 00:00:00</span> · <span id="spdTxt">1×</span></p>

        <button type="button" id="sp1" aria-pressed="true">1×</button>

      <dt>승무원</dt><dd id="stCrew">–</dd>

    </dl>
    <p class="hint">드래그 회전 · 휠 확대 · 우클릭 드래그 이동 · 더블클릭 구획 선택<br>Space 일시정지 · 1–4 배속 · O 자동 회전 · R 전체 보기 · Esc 선택 해제</p>
  </div>
</div>
<p id="fallback" hidden>3D 화면을 시작하지 못했습니다. WebGL을 지원하는 브라우저에서 다시 열어 주세요.</p>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script id="main">
(function () {
  'use strict';
  const stage = document.getElementById('stage');
  const fail = () => { document.getElementById('fallback').hidden = false; };
  if (!window.THREE || !THREE.OrbitControls) { fail(); return; }

  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); }
  catch (e) { fail(); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;        // 그림자 맵은 두 프레임에 한 번만 갱신한다
  let frameNo = 0;
  stage.appendChild(renderer.domElement);

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- scene, camera, controls ---------- */
  const scene = new THREE.Scene();
  const FOV = 20;                                // 좁은 화각의 원근 카메라: 등각 느낌은 유지하고 약한 원근만 준다
  const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 2000);
  const ISO_DIR = new THREE.Vector3(1, 1, 1).normalize();
  let framed = false;
  camera.position.set(59, 58.5, 60);               // 정등각(isometric) 방향
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(14, -2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 14;
  controls.maxDistance = 2400;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.update();

  function resize() {
    const w = stage.clientWidth || window.innerWidth || 800;
    const h = stage.clientHeight || window.innerHeight || 600;
    renderer.setSize(w, h, false);
    const aspect = w / h;
    camera.aspect = aspect;
    if (!framed) {                               // 첫 화면: 선체 전체가 들어오는 거리에서 등각 방향으로 본다
      const viewH = Math.max(74, 150 / aspect);
      const dist = viewH / 2 / Math.tan(FOV * Math.PI / 360);
      camera.position.copy(controls.target).addScaledVector(ISO_DIR, dist);
      controls.update(); framed = true;
    }
    camera.updateProjectionMatrix();
    resizeSky(w, h);
  }

  /* ---------- lights ---------- */
  scene.add(new THREE.HemisphereLight(0xcfd8ff, 0x1a1c30, 0.72));
  const sun = new THREE.DirectionalLight(0xfff1dc, 0.8);
  sun.position.set(86, 134, 47); sun.target.position.set(16, 0, 0);
  sun.castShadow = true;
  sun.shadow.mapSize.set(4096, 4096);
  sun.shadow.camera.left = -125; sun.shadow.camera.right = 125;
  sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 420;
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  scene.add(sun); scene.add(sun.target);

  /* ---------- helpers ---------- */
  const ship = new THREE.Group();
  scene.add(ship);
  let root = ship, off = 0, rot = 0;                // 현재 만들고 있는 구획의 부모 그룹과 좌표 보정

  function rngFactory(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = rngFactory(20261110);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];

  // 점광원이 많아 셰이더가 가벼운 Lambert 재질을 기본으로 쓴다 (roughness/metalness 옵션은 무시)
  const M = (color, o) => { const q = Object.assign({ color }, o || {}); delete q.roughness; delete q.metalness; return new THREE.MeshLambertMaterial(q); };
  const glow = (color, k) => new THREE.MeshLambertMaterial({ color: 0x0a0a0a, emissive: color, emissiveIntensity: k == null ? 1 : k });
  const mats = {
    trim: M(0x8d93a8), hull: M(0xb9b4a6, { roughness: 0.6, metalness: 0.2 }),
    keel: M(0x4b4f63, { roughness: 0.6, metalness: 0.3 }), dark: M(0x2b3042), steel: M(0x7d8499, { metalness: 0.35, roughness: 0.5 }),
    white: M(0xeeeae0), hazard: M(0xf2b632), red: M(0xd8453a), wood: M(0xb98a55), door: M(0x5f6b8a, { metalness: 0.3, roughness: 0.5 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x9fdcff, transparent: true, opacity: 0.22, roughness: 0.1, depthWrite: false })
  };

  function add(mesh, parent, shadow) {
    mesh.castShadow = shadow !== false; mesh.receiveShadow = shadow !== false;
    (parent || root).add(mesh); return mesh;
  }
  // y는 항상 "바닥면 높이" (중심이 아니라)
  function box(w, h, d, mat, x, y, z, parent, shadow) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y + h / 2, z); return add(m, parent, shadow);
  }
  function cyl(rt, rb, h, mat, x, y, z, parent, shadow, seg) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), mat);
    m.position.set(x, y + h / 2, z); return add(m, parent, shadow);
  }
  function ball(r, mat, x, y, z, parent, shadow) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
    m.position.set(x, y, z); return add(m, parent, shadow);
  }
  function sparkAt(x, y, z, parent) {             // 용접 불꽃
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 6, 5), new THREE.MeshBasicMaterial({ color: 0xfff2c0 }));
    m.position.set(x, y, z); parent.add(m); sparks.push(m); return m;
  }
  function grp(x, y, z, parent) { const g = new THREE.Group(); g.position.set(x, y, z); (parent || root).add(g); return g; }

  const flames = [], rings = [], lightPulse = [], bubbles = [], doors = [], puffs = [];
  const sparks = [], armsAnim = [], hoverers = [], bobbers = [], swayers = [], lifters = [];
  const anims = [], turrets = [];                // 구획별 개별 애니메이션 함수, 포탑
  let scanner = null, drone = null, forkLift = null, cat = null;
  const pulsers = [];   // {mat, base, amp, speed, phase}
  const spinners = [];  // {obj, axis, speed}
  const pulse = (mat, amp, speed) => { pulsers.push({ mat, base: mat.emissiveIntensity, amp, speed, phase: rnd() * 6.28 }); return mat; };

  /* ---------- canvas textures: floor panels, wall panels ---------- */
  function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  const panelCanvas = mkCanvas(64, 64);
  (function () {
    const c = panelCanvas.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, 64, 64);
    c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = 2; c.strokeRect(1, 1, 62, 62);
    c.fillStyle = 'rgba(0,0,0,.18)';
    [[6, 6], [58, 6], [6, 58], [58, 58]].forEach(p => { c.beginPath(); c.arc(p[0], p[1], 1.6, 0, 6.3); c.fill(); });
  })();
  const wallCanvas = mkCanvas(64, 64);
  (function () {
    const c = wallCanvas.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, 64, 64);
    c.fillStyle = 'rgba(0,0,0,.24)'; c.fillRect(0, 50, 64, 14);            // 걸레받이
    c.fillStyle = 'rgba(255,170,60,.55)'; c.fillRect(0, 47, 64, 3);        // 주황 띠
    c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(0, 0, 2, 64);              // 패널 이음매
    c.fillRect(0, 10, 64, 1.5);
    c.fillStyle = 'rgba(0,0,0,.3)';
    for (let i = 0; i < 4; i++) c.fillRect(40, 20 + i * 4, 14, 2);         // 통풍구 슬롯
    c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.arc(8, 5, 1.5, 0, 6.3); c.arc(58, 5, 1.5, 0, 6.3); c.fill();
  })();
  function tiled(canvas, rx, ry) {
    const t = new THREE.CanvasTexture(canvas); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t;
  }
  function floor(x0, x1, z0, z1, color) {
    const m = box(x1 - x0, 0.2, z1 - z0, M(color, { map: tiled(panelCanvas, (x1 - x0) / 2, (z1 - z0) / 2), roughness: 0.9 }), (x0 + x1) / 2, -0.2, (z0 + z1) / 2);
    m.castShadow = false; return m;
  }
  const wallMat = len => M(0xdcd6c6, { map: tiled(wallCanvas, Math.max(1, Math.round(len / 2)), 1) });

  /* ---------- animated screen textures (10fps) ---------- */
  const screens = {};
  function mkScreen(name, w, h, draw) {
    const cv = mkCanvas(w, h);
    screens[name] = { ctx: cv.getContext('2d'), tex: new THREE.CanvasTexture(cv), draw, w, h };
  }
  const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
  const BG = '#06090d';
  mkScreen('radar', 96, 96, (c, t, w, h) => {
    c.fillStyle = BG; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,.45)'; c.lineWidth = 1.5;
    [14, 28, 42].forEach(r => { c.beginPath(); c.arc(48, 48, r, 0, 6.3); c.stroke(); });
    const a = t * 1.8;
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(48, 48); c.lineTo(48 + Math.cos(a) * 44, 48 + Math.sin(a) * 44); c.stroke();
    c.fillStyle = '#fff';
    for (let i = 0; i < 5; i++) { const ba = hash(i) * 6.28, br = 10 + hash(i + 9) * 30, d = ((a - ba) % 6.28 + 6.28) % 6.28; c.globalAlpha = Math.max(0.1, 1 - d / 4); c.fillRect(48 + Math.cos(ba) * br - 2, 48 + Math.sin(ba) * br - 2, 5, 5); }
    c.globalAlpha = 1;
  });
  mkScreen('bars', 96, 64, (c, t, w, h) => {
    c.fillStyle = BG; c.fillRect(0, 0, w, h); c.fillStyle = '#fff';
    for (let i = 0; i < 9; i++) { const v = 0.25 + 0.7 * Math.abs(Math.sin(t * (0.8 + hash(i) * 1.6) + i)); c.fillRect(6 + i * 10, h - 6 - v * (h - 14), 7, v * (h - 14)); }
    c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(4, 4, 40, 3);
  });
  mkScreen('wave', 128, 64, (c, t, w, h) => {
    c.fillStyle = BG; c.fillRect(0, 0, w, h);
    c.strokeStyle = 'rgba(255,255,255,.2)'; c.lineWidth = 1;
    for (let x = 0; x < w; x += 16) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, h); c.stroke(); }
    c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath();
    for (let x = 0; x <= w; x += 2) {
      const u = ((x / 46 + t * 1.1) % 1 + 1) % 1;
      const y = u < 0.08 ? -u * 110 : u < 0.16 ? -8.8 + (u - 0.08) * 420 : u < 0.22 ? 24.8 - (u - 0.16) * 413 : Math.sin(u * 14) * 2;
      x ? c.lineTo(x, 36 + y) : c.moveTo(x, 36 + y);
    }
    c.stroke();
  });

  const mm = $('minimap'), mctx = mm.getContext('2d');
  const MM = { x0: -63, x1: 61, z0: -22, z1: 22 };
  mm.addEventListener('click', e => {
    const b = mm.getBoundingClientRect();
    const x = MM.x0 + (e.clientX - b.left) / b.width * (MM.x1 - MM.x0), z = MM.z0 + (e.clientY - b.top) / b.height * (MM.z1 - MM.z0);
    const m = roomAt(x, z);
    if (m) selectRoom(m.id, true); else { selectRoom(null); focusOn(x, z, 30); }
  });
  function drawMap() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = mm.clientWidth || 300, h = mm.clientHeight || 106;
    if (mm.width !== Math.round(w * dpr)) { mm.width = Math.round(w * dpr); mm.height = Math.round(h * dpr); }
    const sx = w / (MM.x1 - MM.x0), sz = h / (MM.z1 - MM.z0), X = x => (x - MM.x0) * sx, Z = z => (z - MM.z0) * sz;
    const c = mctx; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, w, h);
    c.fillStyle = 'rgba(154,162,191,.3)';
    CORRS.forEach(r => c.fillRect(X(r[0]), Z(r[2]), (r[1] - r[0]) * sx, (r[3] - r[2]) * sz));
    for (const id in META) {
      const r = META[id].r;
      c.fillStyle = id === selected ? 'rgba(255,179,71,.7)' : 'rgba(236,233,221,.14)';
      c.fillRect(X(r[0]) + 0.5, Z(r[2]) + 0.5, (r[1] - r[0]) * sx - 1, (r[3] - r[2]) * sz - 1);
    }
    const dot = (x, z, rad, col) => { c.fillStyle = col; c.beginPath(); c.arc(X(x), Z(z), rad, 0, 6.2832); c.fill(); };
    walkers.forEach(k => dot(k.x + k.ox, k.z + k.oz, 1.3, k.y ? '#ffb347' : '#7dffb0'));
    crew.forEach(k => dot(k.x, k.z, 1.8, k.robot ? '#58d6ff' : '#ffffff'));
    if (launcher.position.z < MM.z1 && wingState !== '초계 비행') dot(launcher.position.x, launcher.position.z, 2.2, '#ffd94a');
    c.strokeStyle = '#ffb347'; c.lineWidth = 1;                                    // 화면 중심 표시
    const tx = X(controls.target.x), tz = Z(controls.target.z);
    c.beginPath(); c.moveTo(tx - 5, tz); c.lineTo(tx + 5, tz); c.moveTo(tx, tz - 5); c.lineTo(tx, tz + 5); c.stroke();
  }

  // 성능 측정: 느린 기기에서는 해상도, 그다음 그림자 순으로 낮춘다
  let fAcc = 0, fN = 0, fps = 60, slow = 0, quality = 2;
  function measure(raw) {
    if (raw > 3) return;                           // 탭 전환 등으로 멈췄던 프레임은 제외
    fAcc += raw; fN++;
    if (fAcc < 1) return;
    fps = fN / fAcc; fAcc = 0; fN = 0;
    slow = fps < 26 && !document.hidden ? slow + 1 : 0;
    if (slow >= 3 && quality > 0) {
      quality--; slow = 0;
      if (quality === 1) { renderer.setPixelRatio(1); resize(); } else { sun.castShadow = false; renderer.shadowMap.needsUpdate = true; }
    }
  }
  const pad2 = n => (n < 10 ? '0' : '') + n;
  function updateHud() {
    let work = 0, walk = 0, rest = 0, bots = 0;
    const occ = {};
    crew.forEach(k => {
      const rid = k.station.room.id;
      if (k.robot) bots++; else if (k.state === 'walk') walk++; else if (REST[rid] || k.station.pose === 'lie') rest++; else work++;
      if (k.state === 'work') { const o = occ[rid] || (occ[rid] = [0, 0]); o[k.robot ? 1 : 0]++; }
    });
    for (const id in META) META[id].cnt.textContent = occ[id] ? occ[id][0] + occ[id][1] : 0;
    const s = Math.floor(simT);
    $('clock').textContent = 'T+ ' + pad2(Math.floor(s / 3600)) + ':' + pad2(Math.floor(s / 60) % 60) + ':' + pad2(s % 60);
    $('stCrew').textContent = '근무 ' + work + ' · 이동 ' + walk + ' · 휴식 ' + rest;
    $('stBots').textContent = '휴머노이드 ' + bots + ' · 청소 ' + walkers.filter(k => !k.y).length + ' · 드론 ' + (walkers.filter(k => k.y).length + extDrones.length + 3);
    $('stWing').textContent = '격납 3 · 초계 3 · 1번기 ' + wingState;
    $('stFps').textContent = Math.round(fps) + ' fps · 품질 ' + ['낮음', '중간', '높음'][quality];
    const sel = $('sel');
    if (selected) {
      const m = META[selected], o = occ[selected] || [0, 0];
      sel.textContent = '';
      const code = document.createElement('b'); code.textContent = m.code;
      const nm = document.createElement('strong'); nm.textContent = m.ko;
      sel.appendChild(code); sel.appendChild(nm); sel.appendChild(document.createTextNode(' — 승무원 ' + o[0] + ' · 로봇 ' + o[1]));
    } else sel.textContent = '구획을 선택하면 그곳으로 이동합니다.';
  }

  /* ---------- animation loop ---------- */
  let last = performance.now();
  function simStep(dt, t) {

    for (let i = 0; i < crew.length; i++) updateCrew(crew[i], dt, t);
    updateDoors(dt);
    updateScreens(dt, t);
    for (let i = 0; i < pulsers.length; i++) { const p = pulsers[i]; p.mat.emissiveIntensity = p.base + Math.sin(t * p.speed + p.phase) * p.amp * 0.5; }
    for (let i = 0; i < spinners.length; i++) spinners[i].obj.rotation[spinners[i].axis] += spinners[i].speed * dt;
    for (let i = 0; i < lightPulse.length; i++) { const l = lightPulse[i]; l.light.intensity = l.base + Math.sin(t * l.speed) * l.amp; }
    for (let i = 0; i < rings.length; i++) rings[i].mesh.position.y = rings[i].base + Math.sin(t * 1.6 + rings[i].phase) * 0.22;
    for (let i = 0; i < flames.length; i++) { const f = flames[i], s = 0.85 + Math.sin(t * 17 + f.phase) * 0.08 + Math.sin(t * 5.3 + f.phase) * 0.07; f.mesh.scale.set(1, s, 1); f.mesh.position.x = f.base - f.len / 2 * s; }
    for (let i = 0; i < bubbles.length; i++) {
      const b = bubbles[i], u = (t * b.speed + b.off) % 1, a = b.ang + t * 0.8;
      b.mesh.position.set(b.cx + Math.cos(a) * b.rad, 0.4 + u * (b.top - 0.5), b.cz + Math.sin(a) * b.rad);
    }
    for (let i = 0; i < puffs.length; i++) {
      const p = puffs[i], u = (t * 0.28 + p.off) % 1;
      p.mesh.position.set(p.x + p.dx * u, p.y + u * p.rise, p.z + p.dz * u);
      p.mesh.scale.setScalar((0.5 + u * 1.6) * p.sc); p.mesh.material.opacity = 0.34 * (1 - u);
    }
    if (scanner) scanner.position.z = 8.1 + Math.sin(t * 0.9) * 0.8;
    if (drone) { drone.position.set(-9.5 + Math.sin(t * 0.45) * 3.4, 2.7 + Math.sin(t * 2.2) * 0.06, -6.4 + Math.sin(t * 0.9) * 2.0); drone.rotation.y = Math.sin(t * 0.45) * 0.6; }
    if (forkLift) forkLift.userData.fork.position.y = 0.2 + (Math.sin(t * 0.5) * 0.5 + 0.5) * 0.9;
    if (cat) { cat.userData.tail.rotation.y = Math.sin(t * 1.7) * 0.7; cat.userData.body.scale.y = 0.75 + Math.sin(t * 1.4) * 0.03; }

    updateExtras(dt, t);

    if (!reduceMotion) { ship.position.y = Math.sin(t * 0.5) * 0.18; ship.rotation.z = Math.sin(t * 0.33) * 0.006; }
    for (let i = 0; i < anims.length; i++) anims[i](t);
    for (let i = 0; i < turrets.length; i++) { const u = turrets[i]; u.head.rotation.y = u.yaw0 + Math.sin(t * 0.25 + u.phase) * 0.6; }
    updateWing(t);
  }
  function tick(now) {
    requestAnimationFrame(tick);
    const raw = Math.max(0, (now - last) / 1000); last = now;
    const rdt = Math.min(0.05, raw);
    if (speed > 0) {                               // 고배속에서는 한 프레임을 여러 단계로 나눠 계산한다
      const n = Math.max(1, Math.ceil(speed / 2)), dt = rdt * speed / n;
      for (let i = 0; i < n; i++) { simT += dt; simStep(dt, simT); }
    }
    measure(raw);
    updateFocus(rdt);
    if ((frameNo++ & 1) === 0) renderer.shadowMap.needsUpdate = true;
    controls.update();
    // 깊이 정밀도를 위해 near/far를 카메라 거리에 맞춰 좁힌다 (바닥 데칼 z-fighting 방지)
    const cd = camera.position.distanceTo(controls.target);
    const near = Math.max(0.5, cd - 190), far = cd + 340;
    if (Math.abs(near - camera.near) > 0.5 || Math.abs(far - camera.far) > 0.5) { camera.near = near; camera.far = far; camera.updateProjectionMatrix(); }
    drawSky(rdt * speed);
    renderer.render(scene, camera);
    hudClock += rdt; if (hudClock >= 0.25) { hudClock = 0; updateHud(); }
    mapClock += rdt; if (mapClock >= 0.12) { mapClock = 0; drawMap(); }
  }

  window.addEventListener('resize', resize);
  resize();
  updateScreens(0, 0, true);
  simStep(0, 0);
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('600 28px "Chakra Petch"'), document.fonts.load('600 64px "IBM Plex Sans KR"', '조종실')])
      .then(() => labelDraws.forEach(d => d())).catch(() => {});
  }
  window.__diorama = { crew, stations: allStations, doors, walkers, NAV, META, CORRS, setSpeed, selectRoom, frameAll };
  requestAnimationFrame(tick);
})();
</script>

</body></html>
